<svg xmlns="http://www.w3.org/2000/svg" width="920" height="320" viewBox="0 0 920 320" role="img" aria-labelledby="title desc">
  <title id="title">GitHub App Daytona git auth flow</title>
  <desc id="desc">A signed-in user installs a GitHub App, Workbench mints short-lived installation tokens, Daytona clones private repos, and the bridge refreshes git and gh credentials.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker>
    <style>
      .box{fill:#f8fafc;stroke:#334155;stroke-width:1.5;rx:14}.title{font:700 15px system-ui,sans-serif;fill:#0f172a}.text{font:13px system-ui,sans-serif;fill:#334155}.small{font:12px ui-monospace,monospace;fill:#475569}.line{stroke:#334155;stroke-width:1.6;marker-end:url(#arrow);fill:none}.note{fill:#ecfeff;stroke:#0891b2;stroke-width:1.2;rx:10}
    </style>
  </defs>
  <rect x="24" y="42" width="150" height="86" class="box"/><text x="44" y="73" class="title">User</text><text x="44" y="98" class="text">Signs in with OAuth</text><text x="44" y="116" class="small">repo picker + identity</text>
  <rect x="230" y="42" width="170" height="86" class="box"/><text x="250" y="73" class="title">GitHub App</text><text x="250" y="98" class="text">Installed per user/org</text><text x="250" y="116" class="small">contents: read/write</text>
  <rect x="470" y="42" width="180" height="86" class="box"/><text x="490" y="73" class="title">Workbench backend</text><text x="490" y="98" class="text">Stores installation id</text><text x="490" y="116" class="small">mints 1h token</text>
  <rect x="720" y="42" width="170" height="86" class="box"/><text x="740" y="73" class="title">Daytona setup</text><text x="740" y="98" class="text">Clones private repo</text><text x="740" y="116" class="small">http.extraHeader</text>
  <rect x="470" y="190" width="180" height="86" class="box"/><text x="490" y="221" class="title">Bridge /auth</text><text x="490" y="246" class="text">Refreshes git + gh</text><text x="490" y="264" class="small">.git-credentials</text>
  <rect x="720" y="190" width="170" height="86" class="box"/><text x="740" y="221" class="title">Agent commands</text><text x="740" y="246" class="text">git pull/push + gh</text><text x="740" y="264" class="small">per-user token</text>
  <path d="M174 85H230" class="line"/><path d="M400 85H470" class="line"/><path d="M650 85H720" class="line"/><path d="M560 128V190" class="line"/><path d="M650 233H720" class="line"/>
  <rect x="52" y="204" width="300" height="54" class="note"/><text x="70" y="226" class="title">Fallback</text><text x="70" y="248" class="text">If no matching app install, Workbench uses the user's OAuth token.</text>
</svg>
