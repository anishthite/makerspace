<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">Better run recovery design</title>
  <desc id="desc">DigitalOcean becomes a stateless relay. Durable run state is authoritative, startup reconciliation re-follows active bridge runs, and the UI reads persisted events.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#0f172a}.title{font-size:28px;font-weight:750}.label{font-size:18px;font-weight:750}.small{font-size:14px;fill:#334155}.tiny{font-size:12px;fill:#475569}.box{fill:#fff;stroke:#94a3b8;stroke-width:2;rx:16}.store{fill:#f8fafc;stroke:#64748b}.ok{fill:#ecfdf5;stroke:#10b981}.cloud{fill:#eff6ff;stroke:#3b82f6}.warn{fill:#fff7ed;stroke:#f97316}.line{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#arrow)}.dash{fill:none;stroke:#64748b;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1120" height="560" fill="#f8fafc"/>
  <text x="40" y="50" class="title">Better fix: durable run ledger + boot-time reconciler</text>
  <text x="40" y="78" class="small">Do not make in-memory `activeRuns` the source of truth.</text>

  <rect x="60" y="145" width="210" height="120" class="box"/>
  <text x="88" y="180" class="label">Browser</text>
  <text x="88" y="210" class="small">reads persisted output</text>
  <text x="88" y="233" class="small">SSE is just live delivery</text>

  <rect x="365" y="120" width="270" height="170" class="box warn"/>
  <text x="395" y="156" class="label">DO backend</text>
  <text x="395" y="187" class="small">on boot: scan active runs</text>
  <text x="395" y="210" class="small">probe bridge status</text>
  <text x="395" y="233" class="small">start followers again</text>
  <text x="395" y="256" class="small">never marks failed just because RAM reset</text>

  <rect x="365" y="370" width="270" height="115" class="box store"/>
  <text x="395" y="405" class="label">D1 run ledger</text>
  <text x="395" y="436" class="small">session + run status</text>
  <text x="395" y="459" class="small">events/output/checkpoints</text>

  <rect x="760" y="145" width="300" height="150" class="box cloud"/>
  <text x="790" y="180" class="label">Cloudflare bridge</text>
  <text x="790" y="211" class="small">/runs/:id/status</text>
  <text x="790" y="234" class="small">/runs/:id/stream?after=...</text>
  <text x="790" y="257" class="small">agent keeps running here</text>

  <path d="M270 205 C310 205 325 205 365 205" class="line"/>
  <text x="290" y="190" class="tiny">API/SSE</text>
  <path d="M500 290 L500 370" class="line"/>
  <text x="515" y="334" class="tiny">write every event</text>
  <path d="M635 205 C690 205 705 205 760 205" class="line"/>
  <text x="660" y="190" class="tiny">follow bridge</text>
  <path d="M635 425 C740 405 770 310 810 295" class="dash"/>
  <text x="690" y="390" class="tiny">after restart: resume followers</text>
  <path d="M365 425 C305 410 285 260 250 245" class="dash"/>
  <text x="252" y="372" class="tiny">UI can still show history</text>

  <rect x="72" y="505" width="976" height="36" rx="12" fill="#ecfdf5" stroke="#10b981"/>
  <text x="96" y="529" class="small">User-visible behavior: “reconnecting to main agent…” first; “failed” only after bridge status proves the run is gone.</text>
</svg>
