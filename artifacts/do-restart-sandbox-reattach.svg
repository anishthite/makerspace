<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">DigitalOcean restart and Cloudflare sandbox reattach flow</title>
  <desc id="desc">Shows that the browser and DigitalOcean control backend can disconnect while the Cloudflare sandbox keeps running, then the backend reattaches using persisted session state.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #0f172a; }
      .title { font-size: 28px; font-weight: 750; }
      .label { font-size: 18px; font-weight: 700; }
      .small { font-size: 14px; fill: #334155; }
      .tiny { font-size: 12px; fill: #475569; }
      .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; rx: 16; }
      .ok { fill: #ecfdf5; stroke: #10b981; }
      .warn { fill: #fff7ed; stroke: #f97316; }
      .fail { fill: #fef2f2; stroke: #ef4444; }
      .cloud { fill: #eff6ff; stroke: #3b82f6; }
      .store { fill: #f8fafc; stroke: #64748b; }
      .line { fill: none; stroke: #334155; stroke-width: 2.5; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow); }
      .cut { fill: none; stroke: #ef4444; stroke-width: 3; stroke-dasharray: 9 7; }
    </style>
  </defs>

  <rect width="1120" height="620" fill="#f8fafc"/>
  <text x="40" y="50" class="title">If the DigitalOcean backend restarts, Cloudflare sandboxes can keep running</text>
  <text x="40" y="78" class="small">Reattach works when session state persists and the sandbox bridge is still alive.</text>

  <rect x="50" y="135" width="210" height="120" class="box"/>
  <text x="78" y="170" class="label">Browser</text>
  <text x="78" y="200" class="small">Thread UI</text>
  <text x="78" y="224" class="small">SSE disconnects during DO outage</text>

  <rect x="355" y="120" width="260" height="150" class="box warn"/>
  <text x="385" y="156" class="label">DigitalOcean control backend</text>
  <text x="385" y="187" class="small">Node API + SSE relay</text>
  <text x="385" y="211" class="small">activeRuns map is in memory</text>
  <text x="385" y="235" class="small">restart clears only this process state</text>

  <rect x="390" y="345" width="210" height="110" class="box store"/>
  <text x="420" y="379" class="label">D1 / durable state</text>
  <text x="420" y="410" class="small">session name</text>
  <text x="420" y="432" class="small">bridgeUrl + runId + token</text>

  <rect x="720" y="120" width="330" height="180" class="box cloud"/>
  <text x="750" y="156" class="label">Cloudflare sandbox</text>
  <text x="750" y="188" class="small">pi-bridge service keeps running</text>
  <text x="750" y="212" class="small">agent run continues inside sandbox</text>
  <text x="750" y="236" class="small">/runs/:id/stream retains recent events</text>
  <text x="750" y="260" class="tiny">keepAlive=true avoids sleep-time FS loss</text>

  <rect x="740" y="385" width="300" height="112" class="box fail"/>
  <text x="770" y="419" class="label">Reattach can fail if…</text>
  <text x="770" y="450" class="small">state was not persisted</text>
  <text x="770" y="472" class="small">DO died mid-launch before bridgeUrl save</text>
  <text x="770" y="494" class="small">Cloudflare slept/destroyed/restarted the bridge</text>

  <path class="line" d="M260 180 C300 180 315 180 355 180"/>
  <text x="278" y="164" class="tiny">API / SSE</text>

  <path class="line" d="M615 180 C660 180 675 180 720 180"/>
  <text x="632" y="164" class="tiny">bridge HTTP stream</text>

  <path class="line" d="M490 270 L492 345"/>
  <text x="505" y="315" class="tiny">persist session</text>

  <path class="dash" d="M595 395 C665 350 670 275 720 235"/>
  <text x="615" y="350" class="tiny">after restart: read D1, follow run</text>

  <path class="cut" d="M330 105 L650 305"/>
  <text x="310" y="105" class="small" fill="#ef4444">DO outage cuts relay, not the sandbox process</text>

  <rect x="66" y="515" width="988" height="58" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="92" y="548" class="label">Bottom line:</text>
  <text x="210" y="548" class="small">a normal DO restart should be reattachable; a long outage or lost durable state turns into resume-from-backup or orphan cleanup.</text>
</svg>
