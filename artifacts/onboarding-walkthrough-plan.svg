<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">Spanner onboarding walkthrough plan</title>
  <desc id="desc">Unsigned hosted users are redirected to the landing page, sign in with GitHub, sign in with Codex, then return to the app.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#1f5e9c"/></marker>
    <style>
      .bg{fill:#faf8f3}.box{fill:#fff;stroke:#1f5e9c;stroke-opacity:.35;stroke-width:2;rx:14}.gate{fill:#ddebF6}.done{fill:#e8f7ee}.warn{fill:#fff7df}.title{font:700 20px Inter,system-ui,sans-serif;fill:#241a12}.text{font:500 14px Inter,system-ui,sans-serif;fill:#4b3a2d}.small{font:500 12px Inter,system-ui,sans-serif;fill:#78635a}.arrow{stroke:#1f5e9c;stroke-width:2.4;fill:none;marker-end:url(#arrow)}.num{fill:#1f5e9c;font:800 14px Inter,system-ui,sans-serif}
    </style>
  </defs>
  <rect class="bg" width="1120" height="560"/>
  <text x="48" y="46" class="title">Lazy onboarding: reuse the existing landing + auth endpoints</text>
  <text x="48" y="70" class="text">No new account form. GitHub is the Spanner account; Codex is the model entitlement.</text>

  <rect class="box" x="48" y="120" width="190" height="120"/>
  <text x="70" y="154" class="num">0</text><text x="98" y="154" class="title">Visitor</text>
  <text x="70" y="184" class="text">opens /, /workspace,</text>
  <text x="70" y="206" class="text">or /settings</text>

  <rect class="box gate" x="292" y="120" width="210" height="120"/>
  <text x="314" y="154" class="num">1</text><text x="342" y="154" class="title">Gate</text>
  <text x="314" y="184" class="text">GET /api/me</text>
  <text x="314" y="206" class="text">if hosted + unsigned</text>
  <text x="314" y="228" class="small">→ /homepage?returnTo=...</text>

  <rect class="box" x="556" y="120" width="220" height="120"/>
  <text x="578" y="154" class="num">2</text><text x="606" y="154" class="title">GitHub step</text>
  <text x="578" y="184" class="text">POST /api/auth/github/login</text>
  <text x="578" y="206" class="text">OAuth callback creates user</text>
  <text x="578" y="228" class="small">return to /homepage?step=codex</text>

  <rect class="box" x="830" y="120" width="242" height="120"/>
  <text x="852" y="154" class="num">3</text><text x="880" y="154" class="title">Codex step</text>
  <text x="852" y="184" class="text">GET /api/auth/openai-codex</text>
  <text x="852" y="206" class="text">POST /login, open device URL</text>
  <text x="852" y="228" class="small">poll /login/:id until complete</text>

  <rect class="box done" x="392" y="340" width="316" height="112"/>
  <text x="416" y="374" class="num">4</text><text x="444" y="374" class="title">Done</text>
  <text x="416" y="404" class="text">Codex signed in → redirect to returnTo</text>
  <text x="416" y="426" class="text">Project/workspace shows normal app</text>

  <rect class="box warn" x="764" y="340" width="308" height="112"/>
  <text x="788" y="374" class="num">5</text><text x="816" y="374" class="title">Resume missing step</text>
  <text x="788" y="404" class="text">GitHub authed but no Codex?</text>
  <text x="788" y="426" class="text">same walkthrough starts at Codex</text>

  <path class="arrow" d="M238 180 H292"/><path class="arrow" d="M502 180 H556"/><path class="arrow" d="M776 180 H830"/>
  <path class="arrow" d="M951 240 C951 300 650 310 604 340"/>
  <path class="arrow" d="M708 396 H764"/>
</svg>
