<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Landing rubric setter</title>
  <style>
    :root { --bg:#FAF8F3; --paper:#FFFDF8; --ink:#241A12; --muted:#5C493A; --line:#D9D0C1; --blue:#1F5E9C; --green:#17634A; --red:#B42318; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 Inter, ui-sans-serif, system-ui, sans-serif; }
    main { width:min(760px, calc(100% - 28px)); margin:0 auto; padding:28px 0 84px; }
    header { margin-bottom:22px; }
    h1 { margin:0; font-size:clamp(38px, 8vw, 72px); line-height:.9; letter-spacing:-.08em; }
    p { margin:8px 0 0; color:var(--muted); }
    .top { position:sticky; top:0; z-index:1; display:flex; justify-content:space-between; align-items:center; gap:12px; margin:18px 0; padding:10px 0; background:var(--bg); border-bottom:1px solid var(--line); }
    .total { font-weight:900; color:var(--green); }
    .total.bad { color:var(--red); }
    button { border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--blue); padding:8px 10px; font-weight:800; cursor:pointer; }
    button.primary { background:var(--blue); color:#fff; border-color:var(--blue); }
    button.danger { color:var(--red); }
    .actions { display:flex; flex-wrap:wrap; gap:8px; }
    .rows { display:grid; gap:10px; }
    .row { border:1px solid var(--line); border-radius:14px; background:var(--paper); padding:12px; }
    .line { display:grid; grid-template-columns:1fr 76px 34px; gap:10px; align-items:center; }
    input, textarea { width:100%; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink); padding:8px 9px; font:inherit; }
    input[type="range"] { padding:0; margin-top:10px; accent-color:var(--blue); }
    .name { border:0; border-bottom:1px solid var(--line); border-radius:0; background:transparent; font-weight:850; font-size:18px; padding-left:0; }
    .weight { text-align:center; font-weight:850; }
    .remove { width:34px; height:34px; padding:0; color:var(--red); }
    details { margin-top:8px; color:var(--muted); }
    summary { cursor:pointer; font-size:13px; font-weight:800; }
    textarea { min-height:56px; margin-top:8px; color:var(--muted); resize:vertical; }
    .note { margin-top:18px; }
    .status { min-height:24px; color:var(--muted); }
    .savebar { position:fixed; left:50%; bottom:14px; transform:translateX(-50%); width:min(760px, calc(100% - 28px)); display:flex; justify-content:space-between; align-items:center; gap:12px; border:1px solid var(--line); border-radius:16px; background:var(--paper); padding:10px; box-shadow:0 18px 50px rgb(31 94 156 / 12%); }
    code { font:12px ui-monospace, SFMono-Regular, Menlo, monospace; color:var(--blue); }
    @media (max-width:640px) { .top, .savebar { align-items:flex-start; flex-direction:column; } .line { grid-template-columns:1fr 64px 34px; } }
  </style>
</head>
<body>
<main>
  <header>
    <h1>Set the rubric.</h1>
    <p>Change weights. Keep the total at 100. Save when done.</p>
  </header>

  <div class="top">
    <div class="total" id="total">total 100</div>
    <div class="actions">
      <button type="button" id="add">Add</button>
      <button type="button" id="normalize">Normalize</button>
      <button type="button" class="danger" id="reset">Reset</button>
    </div>
  </div>

  <section class="rows" id="rows" aria-label="Rubric criteria"></section>

  <label class="note">
    <strong>Note for scoring</strong>
    <textarea id="note" placeholder="Optional: what should the next scoring pass reward or punish?"></textarea>
  </label>
</main>

<div class="savebar">
  <div><strong id="save-title">Draft saves locally.</strong><br><code>state key: rubric</code><p class="status" id="status"></p></div>
  <div class="actions"><button type="button" id="copy">Copy JSON</button><button type="button" class="primary" id="save">Save to Spanner</button></div>
</div>

<script>
const ORIGINAL = [
  { key:'wedge', label:'Single sharp wedge', weight:20, definition:'Lead with one memorable, specific wedge instead of a feature inventory.' },
  { key:'local_pi_unique', label:'Local Pi uniqueness', weight:20, definition:'Foreground local Pi setup, skills, prompts, providers, and AGENTS.md habits running on a remote agent.' },
  { key:'remote_browser', label:'Browser + remote clarity', weight:15, definition:'Make clear Pi runs from the browser on real remote sandboxes.' },
  { key:'recurring_loops', label:'Recurring cloud loops', weight:15, definition:'Make recurring/standing agents and cloud iteration loops feel easy and tied to coding work.' },
  { key:'custom_env', label:'Setup/env customization', weight:10, definition:'Explain repo rules, setup commands, secrets, package managers, checks, and provider defaults without plumbing copy.' },
  { key:'work_evidence', label:'Evidence tied to work', weight:10, definition:'Show evidence as proof of work: diffs, logs, checks, screenshots, decisions, failures, next actions.' },
  { key:'urgency', label:'Buyer urgency', weight:10, definition:'Create an immediate reason to try it now with a clear pain, job, and payoff.' }
];
const STORAGE_KEY = 'spannerRubricSetterSimpleV1';
let requestId = 0;
let state = loadLocal() || { rubric: structuredClone(ORIGINAL), note: '' };
const rows = document.querySelector('#rows');
const total = document.querySelector('#total');
const note = document.querySelector('#note');
const status = document.querySelector('#status');

function slug(value) { return String(value || 'criterion').toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 44) || 'criterion'; }
function esc(value) { return String(value || '').replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;'); }
function loadLocal() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); } catch { return null; } }
function saveLocal() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(payload())); } catch {} }
function framed() { try { return window.parent && window.parent !== window; } catch { return false; } }
function postState(type, data = {}) {
  if (!framed()) return false;
  window.parent.postMessage({ type:`spanner:artifact-state:${type}`, key:'rubric', requestId:`rubric-${++requestId}`, ...data }, '*');
  return true;
}
function payload() { return { rubric: state.rubric, note: note.value.trim(), updatedAt: new Date().toISOString() }; }
function readRows() {
  state.rubric = [...rows.querySelectorAll('.row')].map((row, index) => {
    const label = row.querySelector('[data-label]').value.trim() || `Criterion ${index + 1}`;
    return {
      key: slug(label),
      label,
      weight: Number(row.querySelector('[data-weight]').value) || 0,
      definition: row.querySelector('[data-definition]').value.trim(),
    };
  });
}
function sync() {
  readRows();
  const sum = state.rubric.reduce((n, item) => n + item.weight, 0);
  total.textContent = `total ${sum}`;
  total.classList.toggle('bad', sum !== 100);
  saveLocal();
}
function row(item) {
  const el = document.createElement('article');
  el.className = 'row';
  el.innerHTML = `<div class="line"><input class="name" data-label value="${esc(item.label)}" aria-label="Criterion"><input class="weight" data-weight type="number" min="0" max="100" value="${Number(item.weight) || 0}" aria-label="Weight"><button type="button" class="remove" aria-label="Remove">×</button></div><input data-range type="range" min="0" max="40" value="${Number(item.weight) || 0}" aria-label="Weight slider"><details><summary>definition</summary><textarea data-definition>${esc(item.definition)}</textarea></details>`;
  const range = el.querySelector('[data-range]');
  const weight = el.querySelector('[data-weight]');
  range.addEventListener('input', () => { weight.value = range.value; sync(); });
  weight.addEventListener('input', () => { range.value = Math.min(40, Number(weight.value) || 0); sync(); });
  el.addEventListener('input', sync);
  el.querySelector('.remove').addEventListener('click', () => { el.remove(); sync(); });
  return el;
}
function render() {
  rows.replaceChildren(...state.rubric.map(row));
  note.value = state.note || '';
  sync();
}
window.addEventListener('message', (event) => {
  const message = event.data || {};
  if (message.key !== 'rubric') return;
  if (message.type === 'spanner:artifact-state:loaded' && message.data) {
    if (Array.isArray(message.data.rubric)) state.rubric = message.data.rubric;
    state.note = String(message.data.note || '');
    render();
    status.textContent = 'Loaded saved rubric from Spanner.';
  }
  if (message.type === 'spanner:artifact-state:saved') status.textContent = `Saved to Spanner at ${message.updatedAt || 'now'}.`;
  if (message.type === 'spanner:artifact-state:error') status.textContent = message.error || 'Spanner save failed.';
});

document.querySelector('#add').addEventListener('click', () => { rows.append(row({ label:'New criterion', weight:0, definition:'' })); sync(); });
document.querySelector('#normalize').addEventListener('click', () => {
  readRows();
  const sum = state.rubric.reduce((n, item) => n + item.weight, 0) || 1;
  state.rubric.forEach((item) => item.weight = Math.round(item.weight / sum * 100));
  const drift = 100 - state.rubric.reduce((n, item) => n + item.weight, 0);
  if (state.rubric[0]) state.rubric[0].weight += drift;
  render();
  status.textContent = 'Normalized to 100.';
});
document.querySelector('#reset').addEventListener('click', () => { state = { rubric: structuredClone(ORIGINAL), note:'' }; try { localStorage.removeItem(STORAGE_KEY); } catch {} render(); status.textContent = 'Reset.'; });
document.querySelector('#save').addEventListener('click', () => { sync(); status.textContent = postState('save', { data: payload() }) ? 'Saving to Spanner…' : 'Saved locally. Open inside a Spanner thread to save to the app.'; });
document.querySelector('#copy').addEventListener('click', async () => { sync(); const text = JSON.stringify(payload(), null, 2); try { await navigator.clipboard.writeText(text); status.textContent = 'Copied JSON.'; } catch { status.textContent = text; } });
note.addEventListener('input', sync);
render();
if (framed()) postState('load');
</script>
</body>
</html>
