<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Onboarding state editor</title>
<style>
:root{color-scheme:dark;--bg:#0b0f14;--paper:#111821;--paper2:#172231;--ink:#f4efe7;--muted:#9aa8b6;--blue:#8ab4ff;--green:#7ee2a8;--rule:#2c3b4d;--soft:#10233e}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top left,#163355,transparent 34rem),var(--bg);color:var(--ink);font:14px/1.4 Inter,ui-sans-serif,system-ui,sans-serif}.page{width:min(1180px,calc(100% - 28px));margin:0 auto;padding:18px 0 28px}.top{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:16px}.eyebrow{margin:0 0 8px;color:var(--blue);font:800 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.13em;text-transform:lowercase}h1{max-width:760px;margin:0;font-size:clamp(38px,6vw,72px);line-height:.86;letter-spacing:-.075em}.lede{max-width:650px;margin:12px 0 0;color:var(--muted);font-size:17px}.status{min-height:20px;color:var(--muted);font:12px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace}.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,390px);gap:18px;align-items:start}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}button{border:1px solid var(--rule);border-radius:10px;background:var(--paper);color:var(--ink);padding:9px 12px;font:800 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:lowercase;cursor:pointer}button.primary,.tabs button.active{border-color:var(--blue);background:var(--blue);color:#08111c}.preview{position:relative;display:grid;grid-template-columns:minmax(0,.92fr) minmax(300px,1.08fr);gap:clamp(18px,3vw,34px);min-height:540px;overflow:hidden;border:1px solid var(--rule);border-radius:24px;padding:clamp(22px,4vw,42px);background:radial-gradient(circle at 8% 0%,#17375c,transparent 25rem),linear-gradient(135deg,#141d28,var(--paper));box-shadow:0 24px 80px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.06)}.close{position:absolute;top:14px;right:14px;width:36px;height:36px;padding:0}.copy{align-self:center}.copy h2{max-width:560px;margin:0 0 14px;font-size:clamp(40px,5.8vw,72px);line-height:.86;letter-spacing:-.075em}.copy p:not(.eyebrow){max-width:520px;color:var(--muted);font-size:17px}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}.steps{display:grid;gap:10px;margin:0;padding:0;list-style:none}.steps li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid var(--rule);border-radius:14px;padding:14px;background:rgba(17,24,33,.76)}.num{display:grid;width:34px;height:34px;place-items:center;border-radius:999px;background:var(--paper2);color:var(--blue);font:900 13px/1 ui-monospace,SFMono-Regular,Menlo,monospace}.body{display:grid;gap:3px;min-width:0}.body strong{font-size:16px;line-height:1.1}.body small{color:var(--muted);font-size:13px;line-height:1.3}.pill{border-radius:999px;padding:5px 8px;background:var(--paper2);color:var(--muted);font:800 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:lowercase}.steps li.current{border-color:color-mix(in srgb,var(--blue) 54%,var(--rule));background:color-mix(in srgb,var(--soft) 70%,var(--paper))}.steps li.current .pill{background:var(--blue);color:#08111c}.steps li.done{border-color:color-mix(in srgb,var(--green) 45%,var(--rule))}.steps li.done .num,.steps li.done .pill{background:color-mix(in srgb,var(--green) 18%,var(--paper));color:var(--green)}form{position:sticky;top:12px;display:grid;gap:11px;border:1px solid var(--rule);border-radius:16px;background:rgba(17,24,33,.92);padding:14px}label{display:grid;gap:6px;color:var(--muted);font:800 11px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;text-transform:lowercase}input,textarea{width:100%;border:1px solid var(--rule);border-radius:8px;background:#0c131d;color:var(--ink);padding:10px 11px;font:500 13px/1.35 Inter,ui-sans-serif,system-ui,sans-serif;letter-spacing:0;text-transform:none}textarea{resize:vertical}.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.formHead{display:flex;align-items:center;justify-content:space-between;gap:12px}.formHead h2{margin:0;font-size:20px}.jsonOut{min-height:120px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.note{margin:0;color:var(--muted);font-size:12px}@media(max-width:980px){.grid{grid-template-columns:1fr}form{position:static}.preview{grid-template-columns:1fr}}@media(max-width:640px){.steps li{grid-template-columns:auto minmax(0,1fr)}.pill{grid-column:2;justify-self:start}.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="page">
  <header class="top"><div><p class="eyebrow">inline artifact</p><h1>Edit onboarding state by state.</h1><p class="lede">Pick a state, tune the copy, save the draft here, then tell me to apply it.</p></div><p id="status" class="status">Loading…</p></header>
  <div class="grid"><section><div id="tabs" class="tabs"></div><div id="preview" class="preview"></div></section><form id="form"><div class="formHead"><div><p class="eyebrow" id="stateLabel">state 1</p><h2 id="formTitle">Step</h2></div><button class="primary" type="submit">Save draft</button></div><div id="fields"></div><button type="button" id="showJson">Show JSON</button><textarea id="jsonOut" class="jsonOut" spellcheck="false" hidden></textarea><p class="note">Save uses Spanner artifact state. I can apply the saved JSON to source after you say “apply it”.</p></form></div>
</main>
<script>
const INITIAL = {"eyebrow":"","title":"Let’s get your first agent running.","copy":"","actions":{"github":"Continue with GitHub","project":"Pick repo","codex":""},"statusLabels":{"todo":"","done":"","github":"","codex":"needed","project":"pick","agent":"next"},"steps":[{"id":"github","title":"Connect GitHub","body":"Use your GitHub account for repos and private workspace access."},{"id":"codex","title":"Sign in to Codex","body":"Add model access in Settings so Pi can run the agent."},{"id":"project","title":"Pick a repo","body":"Choose a GitHub repo for the sandbox."},{"id":"agent","title":"Start an agent","body":"Open the workspace, write one prompt, and let it run."}]};
let draft = JSON.parse(JSON.stringify(INITIAL));
let active = 0;
let requestId = 0;
const $ = (id) => document.getElementById(id);
function framed(){try{return window.parent && window.parent !== window}catch{return false}}
function send(type, data={}){if(!framed())return false; window.parent.postMessage({type:'spanner:artifact-state:'+type,key:'onboarding-content',requestId:'onboarding-'+(++requestId),...data},'*'); return true}
function esc(s){return String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function set(path, value){const parts=path.split('.');let node=draft;while(parts.length>1)node=node[parts.shift()];node[parts[0]]=value;render()}
function setStep(field,value){draft.steps[active][field]=value;render()}
function stateFor(i){return i<active?'done':i===active?'current':'todo'}
function labelFor(step,state){return state==='done'?draft.statusLabels.done:state==='current'?(draft.statusLabels[step.id]||state):draft.statusLabels.todo}
function renderPreview(){const p=$('preview');p.innerHTML='<button class="close" type="button">×</button><div class="copy"><p class="eyebrow">'+esc(draft.eyebrow)+'</p><h2>'+esc(draft.title)+'</h2><p>'+esc(draft.copy)+'</p><div class="actions"><button class="primary" type="button">◉ '+esc(draft.actions.github)+'</button><button type="button">▣ '+esc(draft.actions.project)+'</button><button type="button">◎ '+esc(draft.actions.codex)+'</button></div></div><ol class="steps">'+draft.steps.map((step,i)=>{const state=stateFor(i);return '<li class="'+state+'"><span class="num">'+(i+1)+'</span><span class="body"><strong>'+esc(step.title)+'</strong><small>'+esc(step.body)+'</small></span><span class="pill">'+esc(labelFor(step,state))+'</span></li>'}).join('')+'</ol>'}
function field(label,path,value,area=false){return '<label>'+label+(area?'<textarea rows="'+(label==='Title'?2:3)+'" data-path="'+path+'">'+esc(value)+'</textarea>':'<input data-path="'+path+'" value="'+esc(value)+'">')+'</label>'}
function renderFields(){const step=draft.steps[active];$('stateLabel').textContent='state '+(active+1);$('formTitle').textContent=step.title||'Step';$('fields').innerHTML=field('Eyebrow','eyebrow',draft.eyebrow)+field('Title','title',draft.title,true)+field('Body','copy',draft.copy,true)+'<div class="two">'+field('GitHub action','actions.github',draft.actions.github)+field('Repo action','actions.project',draft.actions.project)+field('Codex action','actions.codex',draft.actions.codex)+field('Done label','statusLabels.done',draft.statusLabels.done)+field('Todo label','statusLabels.todo',draft.statusLabels.todo)+field('Current label','statusLabels.'+step.id,draft.statusLabels[step.id]||'')+'</div>'+field('Step title','step.title',step.title)+field('Step body','step.body',step.body,true)}
function renderTabs(){$('tabs').innerHTML=draft.steps.map((s,i)=>'<button type="button" data-step="'+i+'" class="'+(i===active?'active':'')+'">'+(i+1)+'. '+esc(s.title||s.id)+'</button>').join('')}
function render(){active=Math.min(active,draft.steps.length-1);renderTabs();renderPreview();renderFields();$('jsonOut').value=JSON.stringify(draft,null,2)}
document.addEventListener('input',e=>{const path=e.target.dataset.path;if(!path)return;if(path==='step.title')setStep('title',e.target.value);else if(path==='step.body')setStep('body',e.target.value);else set(path,e.target.value)});
document.addEventListener('click',e=>{const step=e.target.dataset.step;if(step!==undefined){active=Number(step);render()} if(e.target.id==='showJson'){$('jsonOut').hidden=!$('jsonOut').hidden;$('jsonOut').select?.()}});
$('form').addEventListener('submit',e=>{e.preventDefault();$('status').textContent='Saving draft…'; if(!send('save',{data:{content:draft}}))$('status').textContent='Draft ready; copy JSON below.'});
window.addEventListener('message',e=>{const m=e.data||{};if(m.key!=='onboarding-content')return;if(m.type==='spanner:artifact-state:loaded'&&m.data?.content){draft=m.data.content;$('status').textContent='Loaded saved draft.';render()} if(m.type==='spanner:artifact-state:saved')$('status').textContent='Saved draft. Tell me “apply it”.'; if(m.type==='spanner:artifact-state:error')$('status').textContent=m.error||'Save failed.'});
render();$('status').textContent=send('load')?'Loading saved draft…':'Ready.';
</script>
</body>
</html>
