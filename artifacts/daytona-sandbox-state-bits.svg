<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1280" viewBox="0 0 1800 1280" role="img" aria-labelledby="title desc">
  <title id="title">Daytona sandbox lifecycle state bits</title>
  <desc id="desc">A detailed state-bit diagram showing what is true at every Spanner and Daytona lifecycle point, including app metadata, sandbox compute, bridge process, Pi run, files, auth, preview URLs, and deletion risk.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#111827"/></marker>
    <marker id="dashArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#92400e"/></marker>
    <style>
      .bg{fill:#f9fafb}.title{font:800 34px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:#111827}.sub{font:14px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:#4b5563}.box{fill:#fff;stroke:#111827;stroke-width:2;rx:14}.soft{fill:#f3f4f6;stroke:#9ca3af}.state{fill:#ffffff;stroke:#111827;stroke-width:2;rx:12}.danger{fill:#fff1f2;stroke:#991b1b}.backup{fill:#faf5ff;stroke:#6b21a8}.label{font:800 14px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:#111827}.small{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#374151}.tiny{font:10.5px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#6b7280}.head{font:800 12px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:#111827}.bitOn{fill:#dcfce7;stroke:#166534}.bitOff{fill:#fee2e2;stroke:#991b1b}.bitMaybe{fill:#fef3c7;stroke:#92400e}.bitText{font:800 10px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#111827;text-anchor:middle;dominant-baseline:middle}.arrow{stroke:#111827;stroke-width:2.3;fill:none;marker-end:url(#arrow)}.dash{stroke:#92400e;stroke-width:2.1;fill:none;marker-end:url(#dashArrow);stroke-dasharray:7 5}.line{stroke:#d1d5db;stroke-width:1}.callout{fill:#fffbeb;stroke:#d97706;stroke-width:1.5;rx:12}.code{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#111827}.mono{font:11px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#111827}
    </style>
  </defs>

  <rect class="bg" width="1800" height="1280"/>
  <text x="40" y="55" class="title">Daytona suspend/resume: actual state bits</text>
  <text x="40" y="82" class="sub">Deeper view: each lifecycle state is just a bundle of booleans across app metadata, Daytona compute, bridge, Pi run, filesystem, auth, preview URL, and deletion risk.</text>

  <!-- state row -->
  <rect x="40" y="115" width="1720" height="190" class="box"/>
  <text x="65" y="145" class="label">Main path</text>

  <g id="s1">
    <rect x="80" y="175" width="165" height="85" class="state"/>
    <text x="100" y="202" class="label">1 · New row</text>
    <text x="100" y="224" class="small">status=launching</text>
    <text x="100" y="244" class="small">no sandbox yet</text>
  </g>
  <g id="s2">
    <rect x="300" y="175" width="165" height="85" class="state"/>
    <text x="320" y="202" class="label">2 · Lookup/create</text>
    <text x="320" y="224" class="small">get(id)</text>
    <text x="320" y="244" class="small">or list(labels)</text>
  </g>
  <g id="s3">
    <rect x="520" y="175" width="165" height="85" class="state"/>
    <text x="540" y="202" class="label">3 · Setup</text>
    <text x="540" y="224" class="small">upload script</text>
    <text x="540" y="244" class="small">repo + bridge</text>
  </g>
  <g id="s4">
    <rect x="740" y="175" width="165" height="85" class="state"/>
    <text x="760" y="202" class="label">4 · Ready</text>
    <text x="760" y="224" class="small">bridge healthy</text>
    <text x="760" y="244" class="small">auth synced</text>
  </g>
  <g id="s5">
    <rect x="960" y="175" width="165" height="85" class="state"/>
    <text x="980" y="202" class="label">5 · Running</text>
    <text x="980" y="224" class="small">Pi run active</text>
    <text x="980" y="244" class="small">SSE stream</text>
  </g>
  <g id="s6">
    <rect x="1180" y="175" width="165" height="85" class="state"/>
    <text x="1200" y="202" class="label">6 · Terminal</text>
    <text x="1200" y="224" class="small">completed/failed</text>
    <text x="1200" y="244" class="small">new run later</text>
  </g>
  <g id="s7">
    <rect x="1400" y="175" width="165" height="85" class="state"/>
    <text x="1420" y="202" class="label">7 · Suspended</text>
    <text x="1420" y="224" class="small">sandbox stopped</text>
    <text x="1420" y="244" class="small">disk retained</text>
  </g>

