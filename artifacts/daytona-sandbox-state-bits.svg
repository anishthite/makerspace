  <!-- procedures -->
  <rect x="40" y="865" width="835" height="240" class="box"/>
  <text x="65" y="895" class="label">Suspend procedure</text>
  <text x="65" y="922" class="mono">1. Load thread row from JSON/D1.</text>
  <text x="65" y="944" class="mono">2. Reject if runStatus is active: launching | starting | running.</text>
  <text x="65" y="966" class="mono">3. Find sandbox by daytonaSandboxId/daytonaSandboxName.</text>
  <text x="65" y="988" class="mono">4. Set autoDeleteInterval long or -1 before stopping.</text>
  <text x="65" y="1010" class="mono">5. Call sandbox.stop(timeout, force=false).</text>
  <text x="65" y="1032" class="mono">6. Persist status=\"suspended\", keep sandbox refs, clear live run fields.</text>
  <text x="65" y="1054" class="mono">7. UI shows Resume, not Continue.</text>
  <rect x="585" y="900" width="255" height="165" class="callout"/>
  <text x="605" y="930" class="label">What suspend kills</text>
  <text x="605" y="954" class="code">bridge process</text>
  <text x="605" y="976" class="code">shell/node child procs</text>
  <text x="605" y="998" class="code">preview connection</text>
  <text x="605" y="1020" class="code">live LLM stream</text>
  <text x="605" y="1042" class="code">CPU/RAM billing</text>

  <rect x="925" y="865" width="835" height="240" class="box"/>
  <text x="950" y="895" class="label">Resume procedure</text>
  <text x="950" y="922" class="mono">1. Load suspended row; require sandbox refs.</text>
  <text x="950" y="944" class="mono">2. sandbox.start(); waitUntilStarted(); refreshData().</text>
  <text x="950" y="966" class="mono">3. Upload + run setup script; setup must not wipe /srv/workspace.</text>
  <text x="950" y="988" class="mono">4. Start bridge service; poll /healthz.</text>
  <text x="950" y="1010" class="mono">5. getPreviewLink(4310); persist fresh bridgeUrl/previewToken.</text>
  <text x="950" y="1032" class="mono">6. POST /auth to sync Pi/GitHub profile.</text>
  <text x="950" y="1054" class="mono">7. Persist status=ready; next prompt creates a new bridgeRunId.</text>
  <rect x="1455" y="900" width="270" height="165" class="callout"/>
  <text x="1475" y="930" class="label">What resume cannot do</text>
  <text x="1475" y="954" class="code">continue old stream</text>
  <text x="1475" y="976" class="code">restore process memory</text>
  <text x="1475" y="998" class="code">reopen sockets</text>
  <text x="1475" y="1020" class="code">undo sandbox deletion</text>
  <text x="1475" y="1042" class="code">save unpushed Git forever</text>

  <!-- snapshot box -->
  <rect x="40" y="1135" width="1720" height="100" class="backup" rx="14"/>
  <text x="65" y="1165" class="label">Snapshot side path</text>
  <text x="65" y="1192" class="mono">Snapshot = filesystem image of the sandbox at a point in time. It is useful before delete/reset/migration or after expensive installs.</text>
  <text x="65" y="1216" class="mono">It does not capture active Pi process memory, in-flight LLM calls, open sockets, bridge clients, or an SSE stream. Restore means create a new sandbox from that image.</text>
</svg>
