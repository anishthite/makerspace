<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120" role="img" aria-labelledby="title desc">
  <title id="title">Theme sample sheet</title>
  <desc id="desc">Six visual theme samples shown as miniature application screens with palettes.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-opacity="0.18"/>
    </filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <style>
      .title{font:700 32px ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;fill:#111827}
      .subtitle{font:500 16px ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;fill:#6b7280}
      .card-title{font:700 24px ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}
      .label{font:600 13px ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;letter-spacing:.08em;text-transform:uppercase;opacity:.7}
      .body{font:500 15px ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;opacity:.82}
      .mono{font:600 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    </style>
  </defs>

  <rect width="1440" height="1120" fill="#f4f6fb"/>
  <text x="70" y="72" class="title">Theme samples</text>
  <text x="70" y="102" class="subtitle">Quick visual passes: palette, surface, nav, content, action state.</text>

  <!-- Midnight Workshop -->
  <g transform="translate(70 140)" filter="url(#shadow)">
    <rect width="620" height="280" rx="28" fill="#07111f"/>
    <rect width="620" height="280" rx="28" fill="url(#grid)"/>
    <text x="30" y="48" class="card-title" fill="#f8fafc">Midnight Workshop</text>
    <text x="30" y="78" class="body" fill="#cbd5e1">dark navy · amber tools · focused build mode</text>
    <rect x="30" y="110" width="560" height="132" rx="18" fill="#0f1b2d" stroke="#263852"/>
    <rect x="52" y="132" width="100" height="88" rx="12" fill="#13243a"/>
    <rect x="174" y="132" width="242" height="12" rx="6" fill="#e6a23c"/>
    <rect x="174" y="158" width="338" height="10" rx="5" fill="#718096" opacity=".75"/>
    <rect x="174" y="182" width="292" height="10" rx="5" fill="#475569"/>
    <rect x="174" y="208" width="112" height="28" rx="14" fill="#e6a23c"/>
    <text x="206" y="227" class="mono" fill="#07111f">Build</text>
    <circle cx="542" cy="146" r="13" fill="#22c55e"/>
    <circle cx="542" cy="184" r="13" fill="#e6a23c"/>
    <circle cx="542" cy="222" r="13" fill="#64748b"/>
  </g>

  <!-- Paper Desk -->
  <g transform="translate(750 140)" filter="url(#shadow)">
    <rect width="620" height="280" rx="28" fill="#fbf7ef"/>
    <text x="30" y="48" class="card-title" fill="#1f2933">Paper Desk</text>
    <text x="30" y="78" class="body" fill="#697386">warm paper · ink text · calm reading</text>
    <rect x="30" y="110" width="560" height="132" rx="18" fill="#fffdf8" stroke="#e4dccd"/>
    <rect x="54" y="134" width="92" height="84" rx="10" fill="#e9f0f7"/>
    <path d="M70 196 C88 166,108 188,126 154" fill="none" stroke="#4d7ea8" stroke-width="5" stroke-linecap="round"/>
    <rect x="172" y="132" width="226" height="12" rx="6" fill="#1f2933"/>
    <rect x="172" y="158" width="342" height="10" rx="5" fill="#a49a8e"/>
    <rect x="172" y="182" width="298" height="10" rx="5" fill="#c5b9aa"/>
    <rect x="172" y="208" width="122" height="28" rx="14" fill="#4d7ea8"/>
    <text x="206" y="227" class="mono" fill="#fffdf8">Read</text>
    <rect x="530" y="130" width="34" height="92" rx="17" fill="#f3eadb"/>
    <rect x="530" y="130" width="34" height="34" rx="17" fill="#d99b6c"/>
  </g>

  <!-- Terminal Bloom -->
  <g transform="translate(70 460)" filter="url(#shadow)">
    <rect width="620" height="280" rx="28" fill="#08090b"/>
    <text x="30" y="48" class="card-title" fill="#e8fff5">Terminal Bloom</text>
    <text x="30" y="78" class="body" fill="#9ca3af">retro terminal · soft neon · friendly dev</text>
    <rect x="30" y="110" width="560" height="132" rx="18" fill="#111318" stroke="#233025"/>
    <circle cx="58" cy="136" r="6" fill="#ff5f87"/>
    <circle cx="78" cy="136" r="6" fill="#ffd166"/>
    <circle cx="98" cy="136" r="6" fill="#70e000"/>
    <text x="54" y="174" class="mono" fill="#76f7a5">$ deploy --preview</text>
    <rect x="54" y="188" width="186" height="9" rx="4" fill="#76f7a5" opacity=".55"/>
    <rect x="54" y="208" width="288" height="9" rx="4" fill="#f472b6" opacity=".65"/>
    <rect x="388" y="146" width="142" height="58" rx="16" fill="#181a22" stroke="#f472b6"/>
    <text x="421" y="181" class="mono" fill="#f472b6">online</text>
    <circle cx="552" cy="204" r="22" fill="#76f7a5"/>
  </g>

  <!-- Solar Quiet -->
  <g transform="translate(750 460)" filter="url(#shadow)">
    <rect width="620" height="280" rx="28" fill="#efe1c6"/>
    <text x="30" y="48" class="card-title" fill="#3f3428">Solar Quiet</text>
    <text x="30" y="78" class="body" fill="#725f4b">sand · clay · olive · low-glare workspace</text>
    <rect x="30" y="110" width="560" height="132" rx="18" fill="#f8edd8" stroke="#d6bf98"/>
    <rect x="52" y="132" width="102" height="88" rx="16" fill="#bf6f4a"/>
    <circle cx="103" cy="176" r="28" fill="#e8b86d"/>
    <rect x="176" y="132" width="196" height="12" rx="6" fill="#3f3428"/>
    <rect x="176" y="158" width="310" height="10" rx="5" fill="#9a8369"/>
    <rect x="176" y="182" width="258" height="10" rx="5" fill="#b9a182"/>
    <rect x="176" y="208" width="122" height="28" rx="14" fill="#68734d"/>
    <text x="211" y="227" class="mono" fill="#fff8e8">Plan</text>
    <path d="M526 134 L566 176 L526 218 L486 176 Z" fill="#68734d" opacity=".35"/>
  </g>

  <!-- Glass Lab -->
  <g transform="translate(70 780)" filter="url(#shadow)">
    <linearGradient id="glass-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9f5ff"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <rect width="620" height="280" rx="28" fill="url(#glass-bg)"/>
    <circle cx="520" cy="52" r="96" fill="#67e8f9" opacity=".35"/>
    <circle cx="102" cy="238" r="82" fill="#a78bfa" opacity=".25"/>
    <text x="30" y="48" class="card-title" fill="#172033">Glass Lab</text>
    <text x="30" y="78" class="body" fill="#526075">frosted surfaces · cyan signal · crisp systems</text>
    <rect x="30" y="110" width="560" height="132" rx="18" fill="#ffffff" fill-opacity=".55" stroke="#ffffff" stroke-opacity=".9"/>
    <rect x="54" y="132" width="116" height="88" rx="16" fill="#ffffff" fill-opacity=".62"/>
    <rect x="188" y="132" width="216" height="12" rx="6" fill="#172033"/>
    <rect x="188" y="158" width="310" height="10" rx="5" fill="#64748b" opacity=".65"/>
    <rect x="188" y="182" width="260" height="10" rx="5" fill="#94a3b8"/>
    <rect x="188" y="208" width="132" height="28" rx="14" fill="#06b6d4"/>
    <text x="222" y="227" class="mono" fill="#ecfeff">Inspect</text>
    <path d="M78 198 L112 148 L146 198 Z" fill="#06b6d4" opacity=".8"/>
  </g>

  <!-- Arcade Night -->
  <g transform="translate(750 780)" filter="url(#shadow)">
    <rect width="620" height="280" rx="28" fill="#17151f"/>
    <text x="30" y="48" class="card-title" fill="#fff7ff">Arcade Night</text>
    <text x="30" y="78" class="body" fill="#b9a8c9">charcoal · neon purple · coral action</text>
    <rect x="30" y="110" width="560" height="132" rx="18" fill="#211d2d" stroke="#3b2d55"/>
    <rect x="54" y="132" width="112" height="88" rx="18" fill="#2d2640"/>
    <circle cx="92" cy="176" r="20" fill="#a855f7"/>
    <rect x="118" y="158" width="22" height="36" rx="11" fill="#fb7185"/>
    <rect x="190" y="132" width="218" height="12" rx="6" fill="#f5d0fe"/>
    <rect x="190" y="158" width="316" height="10" rx="5" fill="#8b7aa0"/>
    <rect x="190" y="182" width="256" height="10" rx="5" fill="#5e4b78"/>
    <rect x="190" y="208" width="128" height="28" rx="14" fill="#fb7185"/>
    <text x="226" y="227" class="mono" fill="#17151f">Play</text>
    <rect x="520" y="130" width="34" height="34" rx="8" fill="#a855f7"/>
    <rect x="520" y="184" width="34" height="34" rx="8" fill="#22d3ee"/>
  </g>
</svg>
