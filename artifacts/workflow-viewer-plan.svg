<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="360" viewBox="0 0 1040 360" role="img" aria-labelledby="title desc">
  <title id="title">Workflow viewer plan</title>
  <desc id="desc">Plan to adapt the current live Workbench workflow rail into a workflow-viewer-style expanded graph while keeping existing run data and polling.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M 28 0 L 0 0 0 28" fill="none" stroke="#ece6d6" stroke-width="1"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1e1e1e"/></marker>
    <style>
      .bg{fill:#fbf8f1}.card{fill:#fffef8;stroke:#1e1e1e;stroke-width:2.5}.soft{fill:#f5f1e6}.blue{fill:#d0ebff}.purple{fill:#e5dbff}.green{fill:#b2f2bb}.orange{fill:#ffd8a8}.title{font:700 24px ui-sans-serif,system-ui}.txt{font:15px ui-sans-serif,system-ui;fill:#333}.mono{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#555}.arrow{stroke:#1e1e1e;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1040" height="360"/><rect width="1040" height="360" fill="url(#grid)"/>
  <rect class="card blue" x="35" y="55" width="210" height="115" rx="18" transform="rotate(-0.4 140 112)"/>
  <text class="title" x="60" y="92">existing data</text><text class="mono" x="60" y="122">/api/threads/:name/</text><text class="mono" x="60" y="142">workflows/:runId</text>
  <rect class="card purple" x="305" y="55" width="230" height="115" rx="18" transform="rotate(0.35 420 112)"/>
  <text class="title" x="332" y="92">thin adapter</text><text class="txt" x="332" y="122">run → phases → cards</text><text class="txt" x="332" y="144">no static parser port</text>
  <rect class="card green" x="605" y="38" width="380" height="150" rx="22" transform="rotate(-0.2 795 113)"/>
  <text class="title" x="634" y="77">workflow-viewer-style UI</text><text class="txt" x="634" y="109">sidebar run list · sketch cards · connectors</text><text class="txt" x="634" y="132">phase lanes · detail drawer · status chips</text><text class="mono" x="634" y="158">frontend/src/runtime/thread.js + styles.css</text>
  <path class="arrow" d="M250 112 C270 110 282 110 300 112"/><path class="arrow" d="M540 112 C565 110 578 105 600 100"/>
  <rect class="card orange" x="210" y="235" width="280" height="80" rx="16" transform="rotate(0.3 350 275)"/>
  <text class="title" x="235" y="268">keep live polling</text><text class="txt" x="235" y="292">same SSE + run refresh loop</text>
  <rect class="card soft" x="560" y="232" width="315" height="84" rx="16" transform="rotate(-0.35 717 274)"/>
  <text class="title" x="586" y="265">small safe server enrich</text><text class="txt" x="586" y="290">only if drawer needs capped full prompt/result</text>
  <path class="arrow" d="M350 232 C345 198 365 176 402 170"/><path class="arrow" d="M720 230 C738 205 760 192 795 188"/>
</svg>
