<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Spanner Daytona sandbox lifecycle</title>
  <desc id="desc">Actual lifecycle flow in this repository: backend owns Daytona SDK, session state, bridge launch, run stop, autostop resume, and disk persistence.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155" />
    </marker>
    <style>
      .bg{fill:#f8fafc}.box{fill:#fff;stroke:#334155;stroke-width:2;rx:14}.api{fill:#dbeafe;stroke:#1d4ed8}.sdk{fill:#ede9fe;stroke:#7c3aed}.sandbox{fill:#dcfce7;stroke:#15803d}.warn{fill:#fef3c7;stroke:#b45309}.bad{fill:#fee2e2;stroke:#b91c1c}.store{fill:#e0f2fe;stroke:#0369a1}.title{font:700 28px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:#0f172a}.label{font:700 15px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:#0f172a}.text{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#334155}.small{font:12px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:#64748b}.arrow{stroke:#334155;stroke-width:2.4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1280" height="760" />
  <text x="40" y="48" class="title">Daytona lifecycle in this repo</text>
  <text x="40" y="74" class="small">Important split: we stop Pi runs ourselves; Daytona stops/starts the sandbox mostly through autostop + wake.</text>

  <rect x="40" y="115" width="210" height="120" class="box api" />
  <text x="60" y="145" class="label">Browser / API</text>
  <text x="60" y="174" class="text">POST /api/threads</text>
  <text x="60" y="195" class="text">POST /api/chat</text>
  <text x="60" y="216" class="text">POST /api/bridge-intents</text>

  <rect x="310" y="105" width="260" height="150" class="box api" />
  <text x="330" y="135" class="label">Server services</text>
  <text x="330" y="164" class="text">sessions.js / bridge.js</text>
  <text x="330" y="185" class="text">upsert metadata first</text>
  <text x="330" y="206" class="text">launch worker async</text>
  <text x="330" y="227" class="text">push auth + start run</text>

  <rect x="635" y="105" width="270" height="150" class="box sdk" />
  <text x="655" y="135" class="label">Daytona provider adapter</text>
  <text x="655" y="164" class="text">src/providers/daytona.js</text>
  <text x="655" y="185" class="text">get/list/create/start</text>
  <text x="655" y="206" class="text">process/fs helpers</text>
  <text x="655" y="227" class="text">preview token headers</text>

  <rect x="970" y="105" width="260" height="150" class="box sandbox" />
  <text x="990" y="135" class="label">Daytona sandbox</text>
  <text x="990" y="164" class="text">/srv/workspace</text>
  <text x="990" y="185" class="text">/srv/spanner</text>
  <text x="990" y="206" class="text">systemd pi-bridge</text>
  <text x="990" y="227" class="text">preview :4310</text>

  <path class="arrow" d="M250 175 H310" />
  <path class="arrow" d="M570 175 H635" />
  <path class="arrow" d="M905 175 H970" />

  <rect x="75" y="315" width="265" height="145" class="box sdk" />
  <text x="95" y="345" class="label">Create / wake</text>
  <text x="95" y="374" class="text">stored id/name? get()</text>
  <text x="95" y="395" class="text">else create({labels, env})</text>
  <text x="95" y="416" class="text">if stopped: sandbox.start()</text>
  <text x="95" y="437" class="text">waitUntilStarted()</text>

  <rect x="380" y="315" width="265" height="145" class="box sandbox" />
  <text x="400" y="345" class="label">Setup on every createSession</text>
  <text x="400" y="374" class="text">upload /tmp/spanner-setup.sh</text>
  <text x="400" y="395" class="text">clone/fetch repo</text>
  <text x="400" y="416" class="text">write bridge-env.sh</text>
  <text x="400" y="437" class="text">enable pi-bridge.service</text>

  <rect x="685" y="315" width="265" height="145" class="box api" />
  <text x="705" y="345" class="label">Run traffic</text>
  <text x="705" y="374" class="text">POST bridge /auth</text>
  <text x="705" y="395" class="text">POST bridge /runs</text>
  <text x="705" y="416" class="text">GET /runs/:id/stream</text>
  <text x="705" y="437" class="text">POST /runs/:id/stop</text>

  <rect x="990" y="315" width="220" height="145" class="box warn" />
  <text x="1010" y="345" class="label">No true pause</text>
  <text x="1010" y="374" class="text">stop == abort Pi run</text>
  <text x="1010" y="395" class="text">archive UI hides row</text>
  <text x="1010" y="416" class="text">sandbox.stop() unused</text>
  <text x="1010" y="437" class="text">resume == new prompt/wake</text>

  <path class="arrow" d="M340 388 H380" />
  <path class="arrow" d="M645 388 H685" />
  <path class="arrow" d="M950 388 H990" />

  <rect x="80" y="540" width="270" height="135" class="box store" />
  <text x="100" y="570" class="label">App state</text>
  <text x="100" y="599" class="text">data/sessions.json or D1</text>
  <text x="100" y="620" class="text">daytonaSandboxId/name</text>
  <text x="100" y="641" class="text">bridgeUrl + previewToken</text>
  <text x="100" y="662" class="text">run/thread status</text>

  <rect x="390" y="540" width="270" height="135" class="box sandbox" />
  <text x="410" y="570" class="label">Sandbox disk state</text>
  <text x="410" y="599" class="text">persists while sandbox exists</text>
  <text x="410" y="620" class="text">autostop keeps disk</text>
  <text x="410" y="641" class="text">autodelete removes disk</text>
  <text x="410" y="662" class="text">no save API call here</text>

  <rect x="700" y="540" width="270" height="135" class="box sandbox" />
  <text x="720" y="570" class="label">Workspace mode</text>
  <text x="720" y="599" class="text">one ws sandbox per user+repo</text>
  <text x="720" y="620" class="text">main checkout + worktrees</text>
  <text x="720" y="641" class="text">D1 KV indexes workspace</text>
  <text x="720" y="662" class="text">threads reuse bridge/disk</text>

  <rect x="1010" y="540" width="205" height="135" class="box bad" />
  <text x="1030" y="570" class="label">Likely live bug</text>
  <text x="1030" y="599" class="text">SDK list() returns</text>
  <text x="1030" y="620" class="text">AsyncIterator, but</text>
  <text x="1030" y="641" class="text">adapter expects Array</text>
  <text x="1030" y="662" class="text">=> live list empty</text>

  <path class="arrow" d="M210 460 V540" />
  <path class="arrow" d="M520 460 V540" />
  <path class="arrow" d="M820 460 V540" />
</svg>
