<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Spanner Cloudflare sandbox deployment topology</title>
  <desc id="desc">Browser talks to Vercel frontend and DigitalOcean backend. Backend talks to Cloudflare Worker broker, which owns Durable Objects, sandbox containers, port exposure, and R2 backups.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155" />
    </marker>
    <style>
      .box{fill:#fff;stroke:#334155;stroke-width:2;rx:14;ry:14}.zone{fill:#f8fafc;stroke:#94a3b8;stroke-width:2;rx:18;ry:18}.title{font:700 18px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:#0f172a}.text{font:14px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:#334155}.mono{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#0f172a}.small{font:12px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:#64748b}.line{stroke:#334155;stroke-width:2.2;fill:none;marker-end:url(#arrow)}.dash{stroke:#64748b;stroke-width:2;fill:none;stroke-dasharray:6 5;marker-end:url(#arrow)}.warn{fill:#fff7ed;stroke:#f97316;stroke-width:2;rx:12;ry:12}.ok{fill:#ecfdf5;stroke:#10b981;stroke-width:2;rx:12;ry:12}
    </style>
  </defs>

  <rect x="28" y="28" width="1224" height="704" class="zone"/>
  <text x="54" y="64" class="title">Spanner production after Daytona removal</text>
  <text x="54" y="88" class="small">No Daytona fallback. Local provider still exists only for desktop/local-folder mode.</text>

  <rect x="70" y="145" width="170" height="82" class="box"/>
  <text x="100" y="176" class="title">User browser</text>
  <text x="92" y="201" class="text">uses Spanner UI</text>

  <rect x="335" y="92" width="210" height="95" class="box"/>
  <text x="365" y="123" class="title">Vercel static UI</text>
  <text x="360" y="150" class="mono">spanner.sh</text>
  <text x="360" y="171" class="small">built with VITE_SPANNER_API_BASE</text>

  <rect x="335" y="260" width="230" height="110" class="box"/>
  <text x="368" y="292" class="title">DigitalOcean backend</text>
  <text x="365" y="319" class="mono">api.spanner.sh</text>
  <text x="365" y="342" class="small">Node control plane, auth, SSE, sessions</text>

  <rect x="690" y="230" width="245" height="130" class="box"/>
  <text x="724" y="262" class="title">Cloudflare Worker broker</text>
  <text x="716" y="289" class="mono">sandbox.spanner.sh</text>
  <text x="716" y="312" class="mono">*.sandbox.spanner.sh</text>
  <text x="716" y="337" class="small">Bearer-protected API around @cloudflare/sandbox</text>

  <rect x="1000" y="118" width="190" height="86" class="box"/>
  <text x="1029" y="151" class="title">Durable Object</text>
  <text x="1027" y="176" class="small">one sandbox id = one DO</text>

  <rect x="985" y="275" width="220" height="170" class="box"/>
  <text x="1028" y="306" class="title">Sandbox container</text>
  <text x="1013" y="334" class="mono">/workspace</text>
  <text x="1013" y="356" class="mono">/home/root/.spanner</text>
  <text x="1013" y="378" class="mono">pi bridge :4310</text>
  <text x="1013" y="406" class="small">git/npm/test workloads run here</text>

  <rect x="700" y="455" width="225" height="100" class="box"/>
  <text x="752" y="488" class="title">R2 backups</text>
  <text x="724" y="516" class="mono">spanner-sandbox-backups</text>
  <text x="724" y="538" class="small">workspace + Pi session traces</text>

  <rect x="85" y="465" width="470" height="150" class="ok"/>
  <text x="112" y="499" class="title">Environment goes here</text>
  <text x="112" y="528" class="mono">Vercel: VITE_SPANNER_API_BASE=https://api.spanner.sh</text>
  <text x="112" y="552" class="mono">DigitalOcean: INFRA_PROVIDER=cloudflare</text>
  <text x="112" y="576" class="mono">DigitalOcean: CLOUDFLARE_SANDBOX_BROKER_URL=https://sandbox.spanner.sh</text>
  <text x="112" y="600" class="mono">Worker secret: BROKER_TOKEN</text>

  <rect x="680" y="606" width="480" height="72" class="warn"/>
  <text x="708" y="636" class="title">DNS gotcha</text>
  <text x="708" y="661" class="text">workers.dev is fine for health/exec smoke tests, but bridge port URLs need a custom wildcard domain.</text>

  <path d="M240 176 C275 160 298 140 335 138" class="line"/>
  <text x="257" y="145" class="small">GET spanner.sh</text>

  <path d="M240 205 C292 250 300 298 335 313" class="line"/>
  <text x="244" y="283" class="small">API calls/SSE</text>

  <path d="M565 313 C620 310 640 298 690 295" class="line"/>
  <text x="590" y="282" class="small">Bearer broker API</text>

  <path d="M935 278 C965 240 975 190 1000 164" class="line"/>
  <text x="923" y="216" class="small">DO binding</text>

  <path d="M935 323 C956 330 967 337 985 348" class="line"/>
  <text x="930" y="375" class="small">exec/read/write/create</text>

  <path d="M935 515 C985 490 1010 455 1052 445" class="dash"/>
  <text x="940" y="493" class="small">backup/restore</text>

  <path d="M812 360 C818 400 817 426 813 455" class="dash"/>
  <text x="826" y="420" class="small">R2 binding</text>

  <path d="M565 345 C655 420 752 578 895 606" class="dash"/>
  <text x="609" y="443" class="small">bridge URL returned as 4310-&lt;id&gt;-bridge.sandbox.spanner.sh</text>
</svg>
