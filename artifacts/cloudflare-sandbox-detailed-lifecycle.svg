<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1720" viewBox="0 0 1900 1720" role="img" aria-labelledby="title desc">
  <title id="title">Detailed Spanner Cloudflare sandbox lifecycle and edge cases</title>
  <desc id="desc">Detailed chart of backend, Cloudflare container, bridge, run states, lifecycle controls, and failure edge cases for Spanner remote main agents.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9fb3d1"/></marker>
    <marker id="warnArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker>
    <style><![CDATA[
      .bg{fill:#0b1020}.panel{fill:#111827;stroke:#26354d;stroke-width:1.5}.node{fill:#172033;stroke:#435571;stroke-width:1.5}.state{fill:#14233c;stroke:#5481c9;stroke-width:1.6}.ok{fill:#0f281d;stroke:#22c55e;stroke-width:1.6}.bad{fill:#301b1b;stroke:#ef4444;stroke-width:1.6}.warnBox{fill:#302414;stroke:#f59e0b;stroke-width:1.6}.cold{fill:#171d2b;stroke:#64748b;stroke-width:1.6}.op{fill:#13202e;stroke:#38bdf8;stroke-width:1.5}.future{fill:#101923;stroke:#64748b;stroke-dasharray:8 6;stroke-width:1.5}.title{fill:#f8fafc;font:700 30px system-ui,-apple-system,Segoe UI,sans-serif}.h{fill:#e5e7eb;font:700 18px system-ui,-apple-system,Segoe UI,sans-serif}.h2{fill:#f8fafc;font:700 22px system-ui,-apple-system,Segoe UI,sans-serif}.t{fill:#cbd5e1;font:14px system-ui,-apple-system,Segoe UI,sans-serif}.small{fill:#9ca3af;font:12.5px system-ui,-apple-system,Segoe UI,sans-serif}.mono{fill:#bfdbfe;font:12px ui-monospace,SFMono-Regular,Menlo,monospace}.muted{fill:#7f8ea3}.warn{fill:#fbbf24}.danger{fill:#fecaca}.success{fill:#bbf7d0}.line{stroke:#9fb3d1;stroke-width:2.2;fill:none;marker-end:url(#arrow)}.warnLine{stroke:#f59e0b;stroke-width:2.4;fill:none;marker-end:url(#warnArrow)}.dash{stroke-dasharray:8 7}.numCircle{fill:#93c5fd}.num{fill:#0b1020;font:700 12px system-ui}.laneLabel{fill:#a5b4fc;font:700 13px ui-monospace,SFMono-Regular,Menlo,monospace}.tableHead{fill:#1f2a44}.rowA{fill:#121b2c}.rowB{fill:#101827}.cellLine{stroke:#2d3a55;stroke-width:1}.cellText{fill:#cbd5e1;font:13px system-ui,-apple-system,Segoe UI,sans-serif}.cellMono{fill:#bfdbfe;font:12px ui-monospace,SFMono-Regular,Menlo,monospace}
    ]]></style>
  </defs>
  <rect class="bg" width="1900" height="1720"/>
  <text x="54" y="56" class="title">Spanner remote sandbox lifecycle: states, controls, and edge cases</text>
  <text x="54" y="84" class="small">Code anchors: <tspan class="mono">src/server/threads.js</tspan>, <tspan class="mono">src/server/bridge.js</tspan>, <tspan class="mono">src/providers/cloudflare.js</tspan>, <tspan class="mono">cloudflare-sandbox-worker/src/index.js</tspan>, generated sandbox <tspan class="mono">pi-bridge.mjs</tspan></text>

  <!-- Main flow -->
  <rect x="40" y="116" width="1820" height="455" rx="18" class="panel"/>
  <text x="66" y="151" class="h2">1 · Normal launch + run state machine</text>
  <text x="66" y="176" class="small">D1 session state and in-memory run state move together most of the time; active run events can temporarily override stored state in the UI.</text>

  <text x="76" y="218" class="laneLabel">backend / D1</text>
  <rect x="76" y="238" width="190" height="88" rx="12" class="state"/>
  <circle cx="98" cy="260" r="11" class="numCircle"/><text x="94" y="264" class="num">1</text>
  <text x="118" y="264" class="h">Create thread</text>
  <text x="96" y="290" class="t">Store session row</text>
  <text x="96" y="310" class="mono">status=launching</text>

  <rect x="326" y="238" width="205" height="88" rx="12" class="state"/>
  <circle cx="348" cy="260" r="11" class="numCircle"/><text x="344" y="264" class="num">2</text>
  <text x="368" y="264" class="h">Launch worker</text>
  <text x="346" y="290" class="t">Async bridge launch</text>
  <text x="346" y="310" class="mono">thread_launch:worker_start</text>

  <text x="600" y="218" class="laneLabel">Cloudflare broker / container</text>
  <rect x="600" y="238" width="205" height="88" rx="12" class="warnBox"/>
  <circle cx="622" cy="260" r="11" class="numCircle"/><text x="618" y="264" class="num">3</text>
  <text x="642" y="264" class="h">Allocate slot</text>
  <text x="620" y="290" class="t">Container starts</text>
  <text x="620" y="310" class="mono">max_instances applies</text>

  <rect x="865" y="238" width="205" height="88" rx="12" class="state"/>
  <circle cx="887" cy="260" r="11" class="numCircle"/><text x="883" y="264" class="num">4</text>
  <text x="907" y="264" class="h">Setup sandbox</text>
  <text x="885" y="290" class="t">Write + run setup</text>
  <text x="885" y="310" class="mono">pi-bridge service</text>

  <rect x="1130" y="238" width="205" height="88" rx="12" class="state"/>
  <circle cx="1152" cy="260" r="11" class="numCircle"/><text x="1148" y="264" class="num">5</text>
  <text x="1172" y="264" class="h">Expose bridge</text>
  <text x="1150" y="290" class="t">Port 4310 URL</text>
  <text x="1150" y="310" class="mono">bridgeUrl=https://4310-…</text>

  <text x="1410" y="218" class="laneLabel">sandbox bridge / Pi</text>
  <rect x="1410" y="238" width="205" height="88" rx="12" class="state"/>
  <circle cx="1432" cy="260" r="11" class="numCircle"/><text x="1428" y="264" class="num">6</text>
  <text x="1452" y="264" class="h">Bridge ready</text>
  <text x="1430" y="290" class="t">Health + auth sync</text>
  <text x="1430" y="310" class="mono">/healthz → /auth</text>

  <path d="M266 282 H326" class="line"/><path d="M531 282 H600" class="line"/><path d="M805 282 H865" class="line"/><path d="M1070 282 H1130" class="line"/><path d="M1335 282 H1410" class="line"/>

  <rect x="260" y="405" width="190" height="84" rx="12" class="state"/>
  <text x="305" y="431" class="h">queued</text>
  <text x="286" y="456" class="t">Bridge accepted run</text>
  <text x="286" y="476" class="mono">run.events: queued</text>
  <rect x="520" y="405" width="190" height="84" rx="12" class="state"/>
  <text x="562" y="431" class="h">starting</text>
  <text x="546" y="456" class="t">Pi session boot</text>
  <text x="546" y="476" class="mono">preparePiSession()</text>
  <rect x="780" y="405" width="190" height="84" rx="12" class="state"/>
  <text x="823" y="431" class="h">running</text>
  <text x="806" y="456" class="t">LLM/tools stream</text>
  <text x="806" y="476" class="mono">SSE events</text>
  <rect x="1040" y="405" width="190" height="84" rx="12" class="ok"/>
  <text x="1074" y="431" class="h">completed</text>
  <text x="1066" y="456" class="success">Assistant output saved</text>
  <text x="1066" y="476" class="mono">done=true exitCode=0</text>
  <rect x="1300" y="405" width="190" height="84" rx="12" class="bad"/>
  <text x="1350" y="431" class="h">failed</text>
  <text x="1326" y="456" class="danger">Run/launch error</text>
  <text x="1326" y="476" class="mono">warning=…</text>
  <rect x="1560" y="405" width="190" height="84" rx="12" class="warnBox"/>
  <text x="1608" y="431" class="h">ready</text>
  <text x="1586" y="456" class="warn">Warm follow-up state</text>
  <text x="1586" y="476" class="mono">keepAlive slot held</text>

  <path d="M1512 326 C1512 365 355 365 355 405" class="line"/>
  <path d="M450 447 H520" class="line"/><path d="M710 447 H780" class="line"/><path d="M970 447 H1040" class="line"/><path d="M1230 447 H1300" class="warnLine"/>
  <path d="M1230 447 H1560" class="line"/><path d="M1560 429 C1320 360 620 360 450 429" class="line dash"/>
  <text x="1188" y="388" class="small">success → ready for follow-up</text>
  <text x="1330" y="388" class="small">any terminal error</text>

  <!-- Controls -->
  <rect x="40" y="604" width="1820" height="430" rx="18" class="panel"/>
  <text x="66" y="640" class="h2">2 · User/system lifecycle controls: save, stop/pause, suspend, delete, destroy</text>

  <rect x="70" y="675" width="330" height="148" rx="14" class="op"/>
  <text x="92" y="704" class="h">Archive</text>
  <text x="92" y="732" class="t">Means: hide from normal thread list.</text>
  <text x="92" y="756" class="t">Allowed: <tspan class="mono">completed</tspan>, <tspan class="mono">ready</tspan>, <tspan class="mono">failed</tspan>.</text>
  <text x="92" y="780" class="t">Sandbox: unchanged. No backup. No destroy.</text>
  <text x="92" y="804" class="mono">sets archivedAt only</text>

  <rect x="430" y="675" width="330" height="148" rx="14" class="warnBox"/>
  <text x="452" y="704" class="h">Stop / “pause” active run</text>
  <text x="452" y="732" class="t">Means: abort current Pi run, not the VM.</text>
  <text x="452" y="756" class="t">Allowed: active <tspan class="mono">launching/starting/running</tspan>.</text>
  <text x="452" y="780" class="t">Result: thread becomes <tspan class="mono">failed</tspan> with stopped warning.</text>
  <text x="452" y="804" class="mono">POST /runs/:id/stop</text>

  <rect x="790" y="675" width="330" height="148" rx="14" class="op"/>
  <text x="812" y="704" class="h">Save / backup</text>
  <text x="812" y="732" class="t">Means: snapshot directories to Cloudflare backup.</text>
  <text x="812" y="756" class="t">What: <tspan class="mono">/workspace</tspan> + <tspan class="mono">pi-sessions</tspan>.</text>
  <text x="812" y="780" class="t">Used by suspend/delete/stale handling.</text>
  <text x="812" y="804" class="mono">cloudflareBackups[]</text>

  <rect x="1150" y="675" width="330" height="148" rx="14" class="op"/>
  <text x="1172" y="704" class="h">Suspend</text>
  <text x="1172" y="732" class="t">Means: backup, then destroy compute.</text>
  <text x="1172" y="756" class="t">Allowed: idle remote only; not active/local.</text>
  <text x="1172" y="780" class="t">Result: <tspan class="mono">status=suspended</tspan>, slot freed.</text>
  <text x="1172" y="804" class="mono">backup → DELETE /sessions/:id</text>

  <rect x="1510" y="675" width="320" height="148" rx="14" class="ok"/>
  <text x="1532" y="704" class="h">Resume</text>
  <text x="1532" y="732" class="t">Means: create new sandbox and restore backups.</text>
  <text x="1532" y="756" class="t">Allowed: only <tspan class="mono">suspended</tspan>.</text>
  <text x="1532" y="780" class="t">Result: bridge re-created, thread <tspan class="mono">ready</tspan>.</text>
  <text x="1532" y="804" class="mono">createSession → restore → /auth</text>

  <rect x="250" y="860" width="420" height="120" rx="14" class="bad"/>
  <text x="272" y="889" class="h">Delete</text>
  <text x="272" y="917" class="t">Means: backup before delete, then remove live sandbox identity.</text>
  <text x="272" y="941" class="t">Result: <tspan class="mono">status=deleted</tspan>, URLs/IDs cleared; backups kept in row.</text>
  <text x="272" y="965" class="mono">backup → destroy → deletedSandboxId</text>

  <rect x="720" y="860" width="420" height="120" rx="14" class="bad"/>
  <text x="742" y="889" class="h">Destroy</text>
  <text x="742" y="917" class="t">Means: kill Cloudflare sandbox immediately.</text>
  <text x="742" y="941" class="t">Safe only after backup if workspace matters.</text>
  <text x="742" y="965" class="mono">provider.destroySession → DELETE /sessions/:id</text>

  <rect x="1190" y="860" width="420" height="120" rx="14" class="future"/>
  <text x="1212" y="889" class="h">Proposed auto-TTL</text>
  <text x="1212" y="917" class="t">After completed/ready sits idle, auto backup+destroy or destroy.</text>
  <text x="1212" y="941" class="t">This prevents completed threads from holding live slots forever.</text>
  <text x="1212" y="965" class="mono">ready idle → suspended/deleted</text>

  <path d="M1655 489 C1655 585 1320 585 1320 675" class="line"/>
  <path d="M875 489 C875 585 595 585 595 675" class="warnLine"/>
  <path d="M1655 489 C1655 600 1315 600 1315 675" class="line dash"/>
  <path d="M1315 823 C1315 850 930 835 930 860" class="line"/>
  <path d="M1315 823 C1315 850 460 835 460 860" class="line"/>

  <!-- Glossary -->
  <rect x="40" y="1068" width="1820" height="250" rx="18" class="panel"/>
  <text x="66" y="1104" class="h2">3 · State glossary</text>
  <rect x="70" y="1130" width="560" height="160" rx="12" class="node"/>
  <text x="92" y="1160" class="h">D1/backend <tspan class="mono">status/runStatus</tspan></text>
  <text x="92" y="1188" class="t"><tspan class="mono">launching</tspan>: backend creating sandbox/bridge.</text>
  <text x="92" y="1212" class="t"><tspan class="mono">starting</tspan>: bridge accepted run; Pi session booting.</text>
  <text x="92" y="1236" class="t"><tspan class="mono">running</tspan>: LLM/tools are streaming.</text>
  <text x="92" y="1260" class="t"><tspan class="mono">ready</tspan>: idle follow-up state; today may still hold a slot.</text>

  <rect x="670" y="1130" width="560" height="160" rx="12" class="node"/>
  <text x="692" y="1160" class="h">Terminal/backend states</text>
  <text x="692" y="1188" class="t"><tspan class="mono">completed</tspan>: agent ended and output was saved.</text>
  <text x="692" y="1212" class="t"><tspan class="mono">failed</tspan>: launch/run/stale/stop error with warning.</text>
  <text x="692" y="1236" class="t"><tspan class="mono">suspended</tspan>: backups exist; compute destroyed; can resume.</text>
  <text x="692" y="1260" class="t"><tspan class="mono">deleted</tspan>: backups kept; sandbox IDs/URLs cleared.</text>

  <rect x="1270" y="1130" width="540" height="160" rx="12" class="node"/>
  <text x="1292" y="1160" class="h">Cloudflare/container states</text>
  <text x="1292" y="1188" class="t"><tspan class="mono">provisioning/starting</tspan>: Cloudflare assigning/booting runtime.</text>
  <text x="1292" y="1212" class="t"><tspan class="mono">running</tspan>: container alive, slot consumed.</text>
  <text x="1292" y="1236" class="t"><tspan class="mono">inactive/destroyed</tspan>: no live compute slot.</text>
  <text x="1292" y="1260" class="t"><tspan class="mono">stale preview</tspan>: exposed bridge URL no longer maps to active runtime.</text>

  <!-- Edge cases table -->
  <rect x="40" y="1350" width="1820" height="320" rx="18" class="panel"/>
  <text x="66" y="1386" class="h2">4 · Edge cases and what should happen</text>
  <rect x="70" y="1410" width="1760" height="34" class="tableHead"/>
  <text x="88" y="1432" class="h">Case</text><text x="390" y="1432" class="h">Symptom</text><text x="820" y="1432" class="h">State/result</text><text x="1240" y="1432" class="h">Recovery</text>
  <g>
    <rect x="70" y="1444" width="1760" height="32" class="rowA"/><text x="88" y="1465" class="cellText">No container slot</text><text x="390" y="1465" class="cellMono">Container is starting… / exec hangs</text><text x="820" y="1465" class="cellText">launch fails before bridge</text><text x="1240" y="1465" class="cellText">free slots, raise cap, retry launch</text>
    <rect x="70" y="1476" width="1760" height="32" class="rowB"/><text x="88" y="1497" class="cellText">Broker/bridge wake race</text><text x="390" y="1497" class="cellMono">503/500 startup response</text><text x="820" y="1497" class="cellText">should retry until timeout</text><text x="1240" y="1497" class="cellText">startup-only retry, not broad command replay</text>
    <rect x="70" y="1508" width="1760" height="32" class="rowA"/><text x="88" y="1529" class="cellText">Bridge never healthy</text><text x="390" y="1529" class="cellMono">Timed out waiting for bridge</text><text x="820" y="1529" class="cellText">launch failed</text><text x="1240" y="1529" class="cellText">inspect setup logs / image</text>
    <rect x="70" y="1540" width="1760" height="32" class="rowB"/><text x="88" y="1561" class="cellText">Auth/profile sync fails</text><text x="390" y="1561" class="cellMono">POST /auth error</text><text x="820" y="1561" class="cellText">launch failed</text><text x="1240" y="1561" class="cellText">fix auth payload/settings, retry</text>
    <rect x="70" y="1572" width="1760" height="32" class="rowA"/><text x="88" y="1593" class="cellText">Pi/model/auth fails</text><text x="390" y="1593" class="cellMono">run failed after /runs</text><text x="820" y="1593" class="cellText">failed with bridge warning</text><text x="1240" y="1593" class="cellText">fix provider auth/model; keep sandbox for logs</text>
    <rect x="70" y="1604" width="1760" height="32" class="rowB"/><text x="88" y="1625" class="cellText">Stream lost / run missing</text><text x="390" y="1625" class="cellMono">404 run not found / no events 45m</text><text x="820" y="1625" class="cellText">mark stale failed; backup attempt</text><text x="1240" y="1625" class="cellText">resume from saved thread or start new run</text>
    <rect x="70" y="1636" width="1760" height="32" class="rowA"/><text x="88" y="1657" class="cellText">Backup fails during delete</text><text x="390" y="1657" class="cellMono">backup route error</text><text x="820" y="1657" class="cellText">rollback previous state; do not delete</text><text x="1240" y="1657" class="cellText">retry delete/suspend after fixing backup</text>
  </g>
</svg>
