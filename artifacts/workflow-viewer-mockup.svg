<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Workflow viewer mockup</title>
  <desc id="desc">A proposed Workbench workflow viewer layout inspired by the standalone workflow-viewer project: sidebar run list, paper-grid stage, hand-drawn workflow cards, phase lanes, and detail drawer.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#ece6d6" stroke-width="1"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="5" dy="6" stdDeviation="0" flood-color="#1e1e1e" flood-opacity="0.13"/></filter>
    <style>
      .bg{fill:#fbf8f1}.paper{fill:#fffef8}.soft{fill:#f5f1e6}.ink{stroke:#1e1e1e;stroke-width:2.5}.dash{stroke:#1e1e1e;stroke-width:2.5;stroke-dasharray:8 8;fill:rgba(255,253,240,.62)}
      .blue{fill:#d0ebff}.orange{fill:#ffd8a8}.purple{fill:#e5dbff}.green{fill:#b2f2bb}.yellow{fill:#fff3bf}.red{fill:#ffe3e3}
      .h1{font:700 44px ui-rounded,system-ui,sans-serif;letter-spacing:-1.5px;fill:#1e1e1e}.h2{font:700 25px ui-rounded,system-ui,sans-serif;fill:#1e1e1e}.txt{font:16px ui-rounded,system-ui,sans-serif;fill:#3a3a3a}.small{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#6b6b6b}.chip{font:700 12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#1e1e1e}.muted{fill:#6b6b6b}.white{fill:#fffef8}
      .arrow{fill:none;stroke:#1e1e1e;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}.railTitle{font:700 24px ui-rounded,system-ui,sans-serif;fill:#1e1e1e}.railDesc{font:14px ui-rounded,system-ui,sans-serif;fill:#6b6b6b}.status{font:700 12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#1971c2}
    </style>
  </defs>

  <rect class="bg" width="1440" height="900"/><rect width="1440" height="900" fill="url(#grid)"/>

  <!-- sidebar -->
  <rect class="paper ink" x="0" y="0" width="295" height="900"/>
  <text class="h2" x="26" y="48">workflow runs</text>
  <text class="small" x="26" y="74">live thread workflows</text>
  <rect class="white ink" x="22" y="104" width="248" height="42" rx="20"/>
  <text class="txt muted" x="42" y="131">filter…</text>

  <rect class="soft" x="0" y="174" width="295" height="92"/>
  <rect fill="#1e1e1e" x="0" y="174" width="4" height="92"/>
  <text class="railTitle" x="24" y="207">code review fanout</text>
  <text class="railDesc" x="24" y="231">4 agents · 3 phases · running</text>
  <text class="status" x="24" y="252">run-mqumvxu9-1</text>

  <text class="railTitle" x="24" y="314">bug hunt loop</text>
  <text class="railDesc" x="24" y="337">6 agents · completed</text>
  <text class="status" x="24" y="358">run-mqujd881-4</text>

  <text class="railTitle" x="24" y="420">landing variants</text>
  <text class="railDesc" x="24" y="443">journal · 2 steps</text>
  <text class="status" x="24" y="464">run-mqt4a12p-2</text>

  <!-- main stage header -->
  <text class="h1" x="350" y="72">code review fanout</text>
  <text class="txt" x="352" y="105">Find risky changes, verify findings, then synthesize a short review.</text>
  <text class="small" x="352" y="132">run-mqumvxu9-1 · running · 5/8 agents done · 18.2k tokens</text>

  <!-- phase pills -->
  <rect class="paper ink" x="352" y="165" width="124" height="34" rx="17"/><text class="chip" x="374" y="187">1 Scout 2/3</text>
  <rect class="paper ink" x="492" y="165" width="144" height="34" rx="17"/><text class="chip" x="514" y="187">2 Verify 3/4</text>
  <rect class="paper ink" x="652" y="165" width="148" height="34" rx="17"/><text class="chip" x="674" y="187">3 Synthesize 0/1</text>

  <!-- phase 1 -->
  <text class="h2" x="354" y="258">01 Scout</text><text class="txt muted" x="472" y="258">— split by review lens</text>
  <rect class="dash" x="350" y="286" width="720" height="170" rx="22"/>
  <g filter="url(#shadow)">
    <rect class="blue ink" x="382" y="320" width="200" height="100" rx="18" transform="rotate(-0.5 482 370)"/>
    <text class="h2" x="404" y="353">security scout</text><text class="txt" x="404" y="379">Map auth/data risks.</text><rect class="paper ink" x="404" y="392" width="72" height="22" rx="9"/><text class="chip" x="417" y="407">done</text>
    <rect class="blue ink" x="616" y="320" width="200" height="100" rx="18" transform="rotate(0.4 716 370)"/>
    <text class="h2" x="638" y="353">ui scout</text><text class="txt" x="638" y="379">Check regressions.</text><rect class="paper ink" x="638" y="392" width="72" height="22" rx="9"/><text class="chip" x="651" y="407">done</text>
    <rect class="orange ink" x="850" y="320" width="180" height="100" rx="18" transform="rotate(-0.25 940 370)"/>
    <text class="h2" x="872" y="353">perf scout</text><text class="txt" x="872" y="379">Still running…</text><rect class="paper ink" x="872" y="392" width="94" height="22" rx="9"/><text class="chip" x="884" y="407">running</text>
  </g>

  <!-- arrow -->
  <path class="arrow" d="M710 468 C704 492 715 512 708 536"/><path class="arrow" d="M694 522 L708 540 L724 522"/>

  <!-- phase 2 -->
  <text class="h2" x="354" y="592">02 Verify</text><text class="txt muted" x="478" y="592">— one skeptic per finding</text>
  <rect class="dash" x="350" y="620" width="720" height="168" rx="22"/>
  <g filter="url(#shadow)">
    <rect class="purple ink" x="382" y="654" width="200" height="98" rx="18" transform="rotate(0.45 482 703)"/>
    <text class="h2" x="404" y="687">verify auth</text><text class="txt" x="404" y="713">Confirmed real.</text><rect class="paper ink" x="404" y="726" width="72" height="22" rx="9"/><text class="chip" x="417" y="741">done</text>
    <rect class="purple ink" x="616" y="654" width="200" height="98" rx="18" transform="rotate(-0.35 716 703)"/>
    <text class="h2" x="638" y="687">verify layout</text><text class="txt" x="638" y="713">False positive.</text><rect class="paper ink" x="638" y="726" width="72" height="22" rx="9"/><text class="chip" x="651" y="741">done</text>
    <rect class="red ink" x="850" y="654" width="180" height="98" rx="18" transform="rotate(0.2 940 703)"/>
    <text class="h2" x="872" y="687">verify cache</text><text class="txt" x="872" y="713">Tool error.</text><rect class="paper ink" x="872" y="726" width="70" height="22" rx="9"/><text class="chip" x="885" y="741">error</text>
  </g>

  <!-- detail drawer -->
  <rect class="paper ink" x="1120" y="0" width="320" height="900"/>
  <text class="h2" x="1150" y="46">security scout</text>
  <rect class="blue ink" x="1150" y="78" width="92" height="28" rx="12"/><text class="chip" x="1172" y="96">agent</text>
  <rect class="green ink" x="1254" y="78" width="84" height="28" rx="12"/><text class="chip" x="1273" y="96">done</text>
  <line x1="1120" y1="130" x2="1440" y2="130" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="8 8"/>
  <text class="small" x="1150" y="168">phase</text><text class="txt" x="1230" y="168">Scout</text>
  <text class="small" x="1150" y="198">model</text><text class="txt" x="1230" y="198">gpt-5.5</text>
  <text class="small" x="1150" y="228">tokens</text><text class="txt" x="1230" y="228">4.2k</text>
  <text class="h2" x="1150" y="288">prompt</text>
  <rect class="soft ink" x="1150" y="310" width="246" height="150" rx="12"/>
  <text class="txt" x="1170" y="342">Review this diff for</text><text class="txt" x="1170" y="368">auth, data exposure,</text><text class="txt" x="1170" y="394">and permission bugs…</text>
  <text class="h2" x="1150" y="520">result</text>
  <rect class="soft ink" x="1150" y="542" width="246" height="120" rx="12"/>
  <text class="txt" x="1170" y="574">Found one real risk:</text><text class="txt" x="1170" y="600">missing owner check in</text><text class="txt" x="1170" y="626">artifact route.</text>
</svg>
