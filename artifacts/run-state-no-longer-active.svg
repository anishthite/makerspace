<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="520" viewBox="0 0 1040 520" role="img" aria-labelledby="title desc">
  <title id="title">Why Spanner shows run state is no longer active</title>
  <desc id="desc">A stored thread says it is running, but the control backend has no live in-memory run and cannot prove it can follow the Cloudflare bridge.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#0f172a}.title{font-size:27px;font-weight:750}.label{font-size:18px;font-weight:750}.small{font-size:14px;fill:#334155}.tiny{font-size:12px;fill:#475569}.box{fill:#fff;stroke:#94a3b8;stroke-width:2;rx:16}.bad{fill:#fef2f2;stroke:#ef4444}.warn{fill:#fff7ed;stroke:#f97316}.ok{fill:#ecfdf5;stroke:#10b981}.store{fill:#f8fafc;stroke:#64748b}.line{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#arrow)}.dash{fill:none;stroke:#64748b;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1040" height="520" fill="#f8fafc"/>
  <text x="38" y="48" class="title">That warning means: stored state says “active”, live control state is gone</text>
  <text x="38" y="76" class="small">Spanner currently treats that mismatch as failed unless it can re-follow the bridge run.</text>

  <rect x="60" y="130" width="250" height="120" class="box store"/>
  <text x="88" y="164" class="label">Stored session</text>
  <text x="88" y="195" class="small">runStatus = running/starting</text>
  <text x="88" y="218" class="small">maybe bridgeUrl/runId/token</text>

  <rect x="405" y="115" width="260" height="150" class="box warn"/>
  <text x="435" y="150" class="label">DO Node process</text>
  <text x="435" y="181" class="small">activeRuns is in memory</text>
  <text x="435" y="204" class="small">restart/deploy clears it</text>
  <text x="435" y="227" class="small">route often calls decorateLiveSession()</text>

  <rect x="760" y="130" width="220" height="120" class="box ok"/>
  <text x="790" y="164" class="label">Cloudflare bridge</text>
  <text x="790" y="195" class="small">may still be running</text>
  <text x="790" y="218" class="small">/runs/:id/stream can reattach</text>

  <path d="M310 190 C350 190 365 190 405 190" class="line"/>
  <text x="326" y="174" class="tiny">read stored thread</text>
  <path d="M665 190 C705 190 720 190 760 190" class="dash"/>
  <text x="678" y="174" class="tiny">only if syncRunOutput runs</text>

  <rect x="160" y="340" width="720" height="90" class="box bad"/>
  <text x="195" y="376" class="label">Warning path</text>
  <text x="195" y="407" class="small">No activeRuns entry + stored status is active + no terminal completed/failed timestamp ⇒ “Run state is no longer active; start a new main agent.”</text>

  <path d="M535 265 C535 300 520 315 520 340" class="line"/>
</svg>
