<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Follow-up completed bridge handoff</title>
  <desc id="desc">Diagram showing why completed bridge follow-ups incorrectly returned a startup error and how the fixed status gate starts the next run.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
    <style>
      .bg{fill:#f8fafc}.title{font:700 30px ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;fill:#0f172a}.sub{font:15px ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;fill:#475569}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2}.decision{fill:#fff7ed;stroke:#fb923c;stroke-width:2}.ok{fill:#ecfdf5;stroke:#10b981;stroke-width:2}.bad{fill:#fef2f2;stroke:#ef4444;stroke-width:2}.code{font:600 15px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#0f172a}.body{font:14px ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;fill:#334155}.small{font:12px ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;fill:#64748b}.arrow{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.badarrow{stroke:#b91c1c;stroke-width:2.5;fill:none;stroke-dasharray:7 6;marker-end:url(#red-arrow)}.label{font:13px ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;fill:#334155}.red{fill:#b91c1c}.green{fill:#047857}
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1280" height="760"/>
  <text class="title" x="60" y="58">Follow-up handoff: stale completed bridge state</text>
  <text class="sub" x="60" y="86">This shows the fix in <tspan class="code">src/server/threads.js</tspan>.</text>

  <rect class="box" x="60" y="140" width="250" height="86" rx="18"/>
  <text class="code" x="86" y="176">User follow-up</text>
  <text class="body" x="86" y="202">POST /api/threads/:name/messages</text>

  <rect class="box" x="375" y="140" width="260" height="86" rx="18"/>
  <text class="code" x="401" y="176">load existing session</text>
  <text class="body" x="401" y="202">bridgeClaimed + old taskPrompt may remain</text>

  <rect class="decision" x="705" y="124" width="270" height="118" rx="18"/>
  <text class="code" x="733" y="164">Is run active?</text>
  <text class="body" x="733" y="193">launching / queued / starting / running</text>
  <text class="small" x="733" y="218">new guard: isActiveRunStatus(status)</text>

  <path class="arrow" d="M310 183 L375 183"/>
  <path class="arrow" d="M635 183 L705 183"/>

  <rect class="decision" x="1015" y="76" width="210" height="98" rx="18"/>
  <text class="code" x="1043" y="114">Active branch</text>
  <text class="body" x="1043" y="140">running? deliver steer/followUp</text>
  <text class="body" x="1043" y="160">starting? keep 409</text>
  <path class="arrow" d="M975 160 C990 150 1000 140 1015 130"/>
  <text class="label" x="988" y="116">yes</text>

  <rect class="ok" x="1015" y="274" width="210" height="116" rx="18"/>
  <text class="code" x="1043" y="314">New run path</text>
  <text class="body" x="1043" y="340">create bridgeRunId</text>
  <text class="body" x="1043" y="362">reuse bridgeUrl/token</text>
  <path class="arrow" d="M975 204 C1005 230 1006 290 1015 324"/>
  <text class="label" x="988" y="260">no: completed/ready</text>

  <rect class="ok" x="705" y="478" width="270" height="116" rx="18"/>
  <text class="code" x="733" y="516">startBridgeRun()</text>
  <text class="body" x="733" y="542">remote bridge accepts new /runs id</text>
  <text class="body" x="733" y="566">thread becomes running</text>
  <path class="arrow" d="M1120 390 C1120 462 1020 536 975 536"/>

  <rect class="bad" x="375" y="478" width="260" height="116" rx="18"/>
  <text class="code red" x="401" y="516">Old bug</text>
  <text class="body" x="401" y="542">completed + bridgeClaimed entered</text>
  <text class="body" x="401" y="566">active branch, then status != running</text>
  <text class="body red" x="401" y="588">409: Main agent is starting</text>
  <path class="badarrow" d="M840 242 C780 395 665 506 635 536"/>
  <text class="label red" x="672" y="422">before: no active-status gate</text>

  <rect class="box" x="60" y="478" width="250" height="116" rx="18"/>
  <text class="code" x="86" y="516">One-line fix</text>
  <text class="body" x="86" y="542">Active delivery requires:</text>
  <text class="code" x="86" y="568">bridgeClaimed &amp;&amp; taskPrompt</text>
  <text class="code green" x="86" y="590">&amp;&amp; isActiveRunStatus(status)</text>

  <path class="arrow" d="M310 536 L375 536"/>
  <text class="small" x="60" y="690">Tests: node --test test/setup-script.test.js test/thread-message-steering.test.js</text>
  <text class="small" x="60" y="714">Diagram artifact: artifacts/followup-completed-bridge-handoff.svg</text>
</svg>
