<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">GitHub auth persistence audit</title>
  <desc id="desc">Shows GitHub OAuth cookie and backend persistence paths, plus likely failure points causing repeat sign-in.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <marker id="warn" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#b45309"/></marker>
    <style>.bg{fill:#f8fafc}.box{fill:#fff;stroke:#334155;stroke-width:2;rx:16}.store{fill:#eff6ff;stroke:#2563eb}.remote{fill:#f5f3ff;stroke:#7c3aed}.warn{fill:#fffbeb;stroke:#b45309}.title{font:700 22px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:#0f172a}.h{font:700 16px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:#0f172a}.t{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#334155}.small{font:12px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:#475569}.arrow{stroke:#334155;stroke-width:2.2;fill:none;marker-end:url(#arrow)}.warnline{stroke:#b45309;stroke-width:2.4;fill:none;stroke-dasharray:7 6;marker-end:url(#warn)}</style>
  </defs>
  <rect class="bg" width="1120" height="620"/>
  <text class="title" x="40" y="44">GitHub auth: where repeat sign-in can happen</text>

  <rect class="box" x="48" y="92" width="250" height="146"/>
  <text class="h" x="70" y="124">Vercel/browser UI</text>
  <text class="t" x="70" y="154">fetch(... credentials: include)</text>
  <text class="t" x="70" y="178">x-workbench-session</text>
  <text class="small" x="70" y="209">Needs API cookie to stick and be sent.</text>

  <rect class="box" x="420" y="92" width="285" height="146"/>
  <text class="h" x="442" y="124">Node API callback</text>
  <text class="t" x="442" y="154">/api/auth/github/callback</text>
  <text class="t" x="442" y="178">Set-Cookie: workbench_auth</text>
  <text class="small" x="442" y="209">Cookie max-age defaults to 30 days.</text>

  <rect class="store" x="812" y="92" width="260" height="146" rx="16"/>
  <text class="h" x="834" y="124">Backend auth store</text>
  <text class="t" x="834" y="154">auth:session:&lt;hash&gt;</text>
  <text class="t" x="834" y="178">auth:oauth:&lt;user&gt;:github</text>
  <text class="small" x="834" y="209">D1 or persistent auth.json required.</text>

  <rect class="remote" x="420" y="380" width="285" height="146" rx="16"/>
  <text class="h" x="442" y="412">Remote bridge</text>
  <text class="t" x="442" y="442">POST /auth github token</text>
  <text class="t" x="442" y="466">~/.git-credentials</text>
  <text class="t" x="442" y="490">GH_TOKEN/GITHUB_TOKEN env</text>

  <rect class="warn" x="48" y="380" width="250" height="146" rx="16"/>
  <text class="h" x="70" y="412">Failure point A</text>
  <text class="small" x="70" y="442">Cross-site cookies blocked or</text>
  <text class="small" x="70" y="463">SameSite/CORS misconfigured.</text>
  <text class="small" x="70" y="494">Fix: same-site domains or API proxy.</text>

  <rect class="warn" x="812" y="380" width="260" height="146" rx="16"/>
  <text class="h" x="834" y="412">Failure point B</text>
  <text class="small" x="834" y="442">Auth store or signing secret resets</text>
  <text class="small" x="834" y="463">on backend restart/deploy.</text>
  <text class="small" x="834" y="494">Fix: D1/persistent disk + stable secret.</text>

  <path class="arrow" d="M298 150 C345 150 372 150 420 150"/>
  <text class="small" x="324" y="136">start OAuth</text>
  <path class="arrow" d="M705 150 C746 150 770 150 812 150"/>
  <text class="small" x="724" y="136">persist user/session/token</text>
  <path class="arrow" d="M562 238 C562 285 562 330 562 380"/>
  <text class="small" x="580" y="312">sync before bridge run</text>
  <path class="warnline" d="M168 238 C168 292 168 328 168 380"/>
  <text class="small" x="184" y="312">cookie not sent</text>
  <path class="warnline" d="M942 238 C942 292 942 328 942 380"/>
  <text class="small" x="958" y="312">state missing after restart</text>
</svg>
