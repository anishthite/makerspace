<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300..700;1,400&family=Noto+Serif+Display:wght@600;700;800;900&family=Saira+Extra+Condensed:wght@400;500;600;700;800&family=Shippori+Mincho+B1:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/styles.css?v=palette-2">
</head>
<body>
  <div class="crt-vignette" aria-hidden="true"></div>
  <div class="crt-scanlines" aria-hidden="true"></div>

  <main class="shell console-grid">
    <nav class="topbar panel-lite" aria-label="Settings controls">
      <a class="brand-mark has-logo" href="/" aria-label="Makerspace home">
        <img class="brand-logo" src="/logo-mark.svg" alt="" aria-hidden="true">
        <strong>settings</strong>
      </a>
      <div class="topbar-actions">
        <a class="nav-link" href="/">agents</a>
      </div>
    </nav>

    <header class="hero panel stack-lg">
      <h1>Settings</h1>
    </header>

    <section id="codex" class="panel stack-lg">
      <div class="panel-header">
        <div>
          <h2>Codex</h2>
        </div>
        <button id="codex-login" type="button">Sign in</button>
      </div>
      <p id="codex-status" class="muted">Checking…</p>
      <div id="codex-device" class="notice hidden"></div>
    </section>

    <section id="github" class="panel stack-lg">
      <div class="panel-header">
        <div>
          <h2>GitHub</h2>
        </div>
        <div class="inline-actions">
          <button id="github-login" type="button">Sign in</button>
          <button id="github-logout" type="button">Disconnect</button>
        </div>
      </div>
      <p id="github-status" class="muted">Checking…</p>
    </section>

    <section class="panel stack-lg">
      <div class="connection-card full-width">
        <div class="connection-head">
          <div>
            <h3>Backend</h3>
          </div>
          <p id="connection-summary" class="connection-summary">same-origin · no token</p>
        </div>
        <div class="input-row">
          <label>
            <span>Backend URL</span>
            <input id="api-base" type="url" placeholder="https://api.yourdomain.com">
            <small>Blank = same-origin.</small>
          </label>
          <label>
            <span>Access token</span>
            <input id="api-token" type="password" placeholder="CONTROL_API_TOKEN" autocomplete="current-password">
            <small>Browser only.</small>
          </label>
        </div>
      </div>
    </section>

    <section class="panel stack-lg">
      <div class="panel-header">
        <div>
          <h2>Appearance</h2>
        </div>
      </div>
      <div class="toggle-list">
        <label class="toggle-card">
          <span>Dark mode <small>Default.</small></span>
          <input id="dark-mode" type="checkbox">
        </label>
        <label class="toggle-card">
          <span>Dark palette <small>Dark mode only.</small></span>
          <select id="dark-palette" aria-label="Dark palette">
            <option value="slate">slate — lighter</option>
            <option value="midnight">midnight — current</option>
            <option value="graphite">graphite — neutral</option>
            <option value="dusk">dusk — purple</option>
            <option value="nerv-os">NERV-OS — retro cyan</option>
          </select>
        </label>
        <label class="toggle-card">
          <span>Monospace font <small>Default.</small></span>
          <input id="mono-font" type="checkbox">
        </label>
      </div>
    </section>

    <section id="pi-profile" class="panel stack-lg">
      <div class="panel-header">
        <div>
          <h2>Pi profile</h2>
        </div>
      </div>
      <form id="pi-profile-form" class="stack-lg">
        <label class="full-width">
          <span>AGENTS.md</span>
          <textarea id="pi-agents" rows="12" spellcheck="false" placeholder="Your ~/.pi/agent/AGENTS.md instructions"></textarea>
          <small id="pi-agents-path" class="muted">Loading…</small>
        </label>
        <label class="toggle-card">
          <span>Sync selected profile to remote sandboxes <small>Per run; not baked into public images.</small></span>
          <input id="pi-sync-remote" type="checkbox">
        </label>
        <div class="profile-resource-grid">
          <div>
            <h3>Skills</h3>
            <div id="pi-skills" class="resource-list muted">Loading…</div>
          </div>
          <div>
            <h3>Extensions</h3>
            <div id="pi-extensions" class="resource-list muted">Loading…</div>
          </div>
          <div>
            <h3>Prompts</h3>
            <div id="pi-prompts" class="resource-list muted">Loading…</div>
          </div>
        </div>
        <div class="form-actions">
          <button id="pi-profile-submit" type="submit">Save profile</button>
          <p id="pi-profile-status" class="muted">Loading…</p>
        </div>
      </form>
    </section>

    <section class="panel stack-lg">
      <div class="panel-header">
        <div>
          <h2>Sandbox</h2>
        </div>
      </div>
      <form id="settings-form" class="stack-lg">
        <div class="form-grid">
          <label class="full-width">
            <span>Image ref</span>
            <input id="image-ref" name="imageRef" placeholder="image ref">
            <small>Blank = default.</small>
          </label>
          <label>
            <span>Registry username</span>
            <input id="registry-username" name="registryUsername" placeholder="username" autocomplete="username">
          </label>
          <label>
            <span>Registry token</span>
            <input id="registry-password" name="registryPassword" type="password" placeholder="token" autocomplete="current-password">
            <small>Blank keeps current.</small>
          </label>
          <label class="full-width">
            <span>Anthropic API key</span>
            <input id="anthropic-api-key" name="anthropicApiKey" type="password" placeholder="API key" autocomplete="off">
            <small>Blank keeps current.</small>
          </label>
        </div>
        <div class="form-actions">
          <button id="settings-submit" type="submit">Save</button>
          <p id="settings-status" class="muted">Loading…</p>
        </div>
      </form>
    </section>
  </main>

  <script type="module" src="/settings.js?v=palette-2"></script>
</body>
</html>
