<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Makerspace Project History</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/styles.css?v=palette-2">
</head>
<body data-mode="office">
  <main class="history-shell">
    <nav class="home-topbar" aria-label="Makerspace navigation">
      <a class="brand" href="/workspace.html" aria-label="Makerspace workspace">
        <img class="brand-logo" src="/logo-mark.svg" alt="" aria-hidden="true">
        <span>makerspace</span>
        <span id="project-label" class="project-pill" hidden></span>
      </a>
      <div class="workspace-chip" aria-label="Selected workspace">
        <strong id="workspace-label">loading…</strong>
        <a class="textbtn" href="/">switch</a>
      </div>
      <div class="header-actions home-actions">
        <a class="textbtn" href="/workspace.html">workspace</a>
        <a class="textbtn" href="/performance.html">performance</a>
        <a class="textbtn" href="/settings.html">settings</a>
      </div>
    </nav>

    <header class="history-hero">
      <div>
        <p class="eyebrow">project history</p>
        <h1>Past agents for this workspace</h1>
        <p id="history-status" class="muted">Loading this project’s saved agents…</p>
      </div>
      <label class="target-input history-search"><span>search</span><input id="history-search" type="search" placeholder="repo, prompt, status, name"></label>
    </header>

    <section id="history-stats" class="history-stats" aria-label="History summary"></section>
    <section id="history-list" class="history-list" aria-label="Past threads, sessions, and agents"></section>
  </main>

  <script type="module" src="/history.js?v=palette-2"></script>
</body>
</html>
