<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Makerspace Projects</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/styles.css?v=palette-2">
</head>
<body data-mode="office">
  <main class="project-shell">
    <nav class="home-topbar" aria-label="Makerspace navigation">
      <a class="brand" href="/" aria-label="Makerspace projects">
        <img class="brand-logo" src="/logo-mark.svg" alt="" aria-hidden="true">
        <span>makerspace</span>
        <span id="project-label" class="project-pill" hidden></span>
      </a>
      <div class="header-actions home-actions">
        <a id="codex-auth-pill" class="auth-pill" href="/settings.html#codex" data-status="checking" aria-live="polite"><span class="status-dot" aria-hidden="true"></span><span id="codex-auth-label">codex</span></a>
        <a id="github-auth-pill" class="auth-pill" href="/settings.html#github" data-status="checking" aria-live="polite"><span class="status-dot" aria-hidden="true"></span><span id="github-auth-label">github</span></a>
        <a class="textbtn" href="/settings.html">settings</a>
      </div>
    </nav>

    <header class="project-hero">
      <h1>Welcome back, Anish.</h1>
      <p class="lede">Choose a local folder on this Mac, or pick a GitHub repo for cloud mode. The agent page stays scoped to it.</p>
    </header>

    <section class="project-grid">
      <form id="project-form" class="project-card" aria-label="Select project">
        <input id="project-repo-source" name="repoSource" type="hidden" value="">
        <input id="project-branch" name="branch" type="hidden" value="">

        <label class="sr-only" for="project-repo-url">folder or repo</label>
        <div class="target-input project-target repo-input">
          <input id="project-repo-url" name="repoUrl" placeholder="/Users/you/project" aria-label="folder or repo" required>
          <button id="project-choose-folder" class="textbtn folder-picker-btn" type="button" hidden aria-label="choose local folder" title="choose local folder">choose folder</button>
        </div>

        <div id="project-repo-tray" class="repo-tray">
          <select id="project-repo-picker" class="board-select" disabled>
            <option value="">GitHub repos</option>
          </select>
          <button id="project-repo-refresh" class="textbtn" type="button">refresh</button>
          <p id="project-repo-hint" class="muted">Choose a local folder or paste a repo.</p>
        </div>

        <button id="project-submit" class="primary-btn" type="submit">open workspace</button>
        <p id="project-status" class="status-line">Select a project to continue.</p>
      </form>

      <section class="project-card recent-projects" aria-label="Recent projects">
        <div class="section-row">
          <div>
            <h2>Recent projects</h2>
            <p class="muted">One click back into a workspace.</p>
          </div>
        </div>
        <div id="project-recent-list" class="project-list"></div>
      </section>
    </section>
  </main>

  <script type="module" src="/project.js?v=palette-2"></script>
</body>
</html>
