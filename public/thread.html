<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Makerspace Thread</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23FAF8F3'/%3E%3Cpath d='M7 23V9h4l5 8 5-8h4v14h-4v-8l-4 6h-2l-4-6v8H7Z' fill='%231F5E9C'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="thread-flow-shell">
    <header class="flow-topbar">
      <a class="brand" href="/">
        <span class="brand-box">←</span>
        <span>thread</span>
      </a>
      <div class="flow-title">
        <strong id="thread-title">Loading</strong>
        <span id="thread-meta" class="muted"></span>
      </div>
      <div class="header-actions">
        <span id="thread-status" class="status-pill">connecting</span>
        <button id="mode-toggle" class="textbtn" type="button" aria-pressed="false"><span id="mode-label">details</span></button>
      </div>
    </header>

    <section class="flow-wrap" aria-label="Thread timeline">
      <section class="now-card flow-card">
        <h1 id="thinking-title">Status</h1>
        <p id="thinking-detail" class="muted"></p>
      </section>

      <section id="thread-details" class="thread-details flow-card" hidden>
        <div id="thread-debug-grid" class="fact-list"></div>
      </section>

      <div id="timeline" class="timeline-flow" aria-live="polite"></div>

      <form id="prompt-form" class="flow-composer">
        <label class="sr-only" for="prompt">Prompt</label>
        <textarea id="prompt" rows="3" placeholder="Next task…"></textarea>
        <button id="send" class="primary-btn" type="submit">send</button>
      </form>
    </section>
  </main>

  <script type="module" src="/thread.js?v=copy-trim-1"></script>
</body>
</html>
