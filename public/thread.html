<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Makerspace Main Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/styles.css?v=palette-2">
</head>
<body class="thread-page">
  <main class="thread-flow-shell">
    <header class="flow-topbar">
      <div class="flow-top-left">
        <a class="brand" href="/workspace.html">
          <span class="brand-box">←</span>
          <span id="project-label" class="project-pill" hidden></span>
        </a>
      </div>
      <div class="flow-title">
        <strong id="thread-title">Loading</strong>
        <span id="thread-meta" class="muted"></span>
      </div>
      <div class="header-actions">
        <span id="thread-status" class="status-pill">connecting</span>
        <button id="archive-thread" class="primary-btn thread-done-btn" type="button" hidden>mark as done</button>
      </div>
    </header>

    <section class="thread-stage" aria-label="Main agent workspace">
      <aside class="agent-column" aria-label="Main agent status">
        <div id="agent-rail" class="agent-rail flow-card" aria-label="Main agent trace" role="button" tabindex="0" aria-controls="agent-trace" aria-expanded="false">
          <div class="rail-head"><span>agent</span><strong id="agent-graph-count">idle</strong></div>
          <p class="rail-hint">click to open trace</p>
          <div id="agent-graph" class="agent-graph"></div>
        </div>
        <details id="diff-box" class="diff-box flow-card" hidden>
          <summary><span>changes</span><strong id="diff-count">0</strong></summary>
          <div class="diff-workbench">
            <div id="diff-files" class="diff-files" role="list"></div>
            <textarea id="diff-editor" class="diff-editor" readonly spellcheck="false" aria-label="Selected file changes"></textarea>
          </div>
        </details>
      </aside>

      <section class="flow-wrap thread-workspace" aria-label="Main agent conversation">
        <section class="now-card flow-card">
          <h1 id="thinking-title">Loading</h1>
          <p id="thinking-detail" class="muted"></p>
        </section>

        <section class="conversation-main flow-card" aria-label="Main agent conversation">
          <div id="timeline" class="timeline-flow" aria-live="polite"></div>
          <aside id="agent-trace" class="agent-activity agent-trace-inline" aria-label="Main agent trace" aria-hidden="true" hidden>
            <div class="agent-activity-head">
              <div class="rail-head"><span>agent trace</span><strong>events</strong></div>
              <button id="agent-activity-close" class="textbtn" type="button">hide</button>
            </div>
            <div id="trace-timeline" class="timeline-flow" aria-live="polite"></div>
          </aside>
        </section>

        <section class="notes-main flow-card" aria-label="Implementation notes" hidden>
          <div class="rail-head"><span>implementation notes</span><strong id="notes-count">0</strong></div>
          <div id="notes-list" class="notes-list"></div>
        </section>

        <form id="prompt-form" class="flow-composer">
          <div class="composer-field">
            <label class="sr-only" for="prompt">Prompt</label>
            <textarea id="prompt" rows="3" placeholder="Next task…"></textarea>
            <div class="composer-controls" aria-label="main agent run controls">
              <div class="attachment-row composer-attachment-row">
                <label class="textbtn attach-btn" for="prompt-images" aria-label="add images" title="add images">+</label>
                <input id="prompt-images" class="image-input" name="images" type="file" accept="image/png,image/jpeg,image/gif,image/webp" multiple>
                <span id="image-status" class="attachment-status muted" role="status" aria-live="polite"></span>
              </div>
              <label class="target-input model-picker"><span>model</span><select id="model-ref" name="modelRef"><option value="">loading model…</option></select></label>
              <label class="target-input thinking-slider"><span>thinking</span><input id="thinking-level" type="range" min="0" max="5" step="1" value="5"><output id="thinking-level-value" for="thinking-level">xhigh</output></label>
            </div>
          </div>
          <button id="send" class="primary-btn" type="submit">send</button>
        </form>
      </section>
    </section>
  </main>

  <script type="module" src="/thread.js?v=palette-2"></script>
</body>
</html>
