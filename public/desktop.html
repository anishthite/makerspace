<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Makerspace Desktop</title>
  <meta name="description" content="Download the Makerspace desktop app for macOS.">
  <link rel="icon" href="/favicon.svg">
  <style>
    :root { color-scheme: dark; --bg: #0f1117; --card: #171b24; --text: #f4f7fb; --muted: #a8b0bf; --line: #2a3140; --accent: #8ab4ff; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--text); font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(620px, 100%); padding: 32px; border: 1px solid var(--line); border-radius: 18px; background: var(--card); box-shadow: 0 24px 80px rgb(0 0 0 / 32%); }
    nav { display: flex; justify-content: space-between; gap: 16px; align-items: center; margin-bottom: 56px; }
    .brand { display: inline-flex; align-items: center; gap: 10px; color: inherit; text-decoration: none; font-weight: 800; letter-spacing: -0.04em; }
    .brand img { width: 32px; height: 32px; }
    a { color: var(--accent); }
    h1 { margin: 0 0 12px; font-size: clamp(44px, 9vw, 76px); line-height: .9; letter-spacing: -0.08em; }
    p { margin: 0; color: var(--muted); }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin: 28px 0 18px; }
    .button { display: inline-flex; min-height: 48px; align-items: center; justify-content: center; padding: 0 18px; border-radius: 12px; background: var(--accent); color: #09111f; text-decoration: none; font-weight: 800; }
    .secondary { background: transparent; color: var(--accent); border: 1px solid var(--line); }
    .install { margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--line); font-size: 14px; }
    @media (max-width: 560px) { main { padding: 24px; } nav { margin-bottom: 42px; } .button { width: 100%; } }
  </style>
</head>
<body>
  <main>
    <nav aria-label="Makerspace navigation">
      <a class="brand" href="/"><img src="/logo-mark.svg" alt="" aria-hidden="true"><span>makerspace</span></a>
      <a href="/">web app</a>
    </nav>

    <section aria-labelledby="title">
      <h1 id="title">Makerspace for Mac.</h1>
      <p>Run Pi agents against local folders from a tiny desktop app.</p>
      <div class="actions">
        <a class="button" href="https://github.com/anishthite/makerspace-downloads/releases/latest/download/makerspace.dmg">Download DMG</a>
        <a class="button secondary" href="https://github.com/anishthite/makerspace-downloads/releases/latest">Release notes</a>
      </div>
      <p class="install">Open the DMG, drag Makerspace to Applications, launch it, pick a folder.</p>
    </section>
  </main>
</body>
</html>
