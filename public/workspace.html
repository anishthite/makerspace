<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Makerspace Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/styles.css?v=palette-2">
</head>
<body data-mode="office" data-home-ui="ops">
  <main class="home-shell">
    <nav class="home-topbar" aria-label="Makerspace navigation">
      <a class="brand" href="/workspace.html" aria-label="Makerspace workspace">
        <img class="brand-logo" src="/logo-mark.svg" alt="" aria-hidden="true">
        <span>makerspace</span>
        <span id="project-label" class="project-pill" hidden></span>
      </a>
      <div class="workspace-chip" aria-label="Selected workspace">
        <strong id="workspace-label">loading…</strong>
        <a class="textbtn" href="/">switch</a>
      </div>
      <div class="header-actions home-actions">
        <a id="codex-auth-pill" class="auth-pill" href="/settings.html#codex" data-status="checking" aria-live="polite"><span class="status-dot" aria-hidden="true"></span><span id="codex-auth-label">codex</span></a>
        <a id="github-auth-pill" class="auth-pill" href="/settings.html#github" data-status="checking" aria-live="polite"><span class="status-dot" aria-hidden="true"></span><span id="github-auth-label">github</span></a>
        <a class="textbtn" href="/performance.html">performance</a>
        <a class="textbtn" href="/settings.html">settings</a>
      </div>
    </nav>

    <h1 class="sr-only">Start a main agent</h1>

    <form id="thread-form" class="launch-card" aria-label="Spin up a main agent">
      <input id="repo-url" name="repoUrl" type="hidden" value="">
      <input name="branch" type="hidden" value="">
      <input name="repoSource" type="hidden" value="">

      <label class="sr-only" for="prompt">Task</label>
      <textarea id="prompt" name="prompt" rows="4" placeholder="Tell the main agent what to do…" required></textarea>

      <div class="composer-controls launch-controls" aria-label="main agent run controls">
        <div class="attachment-row composer-attachment-row">
          <label class="textbtn attach-btn" for="prompt-images" aria-label="add images" title="add images">+</label>
          <input id="prompt-images" class="image-input" name="images" type="file" accept="image/png,image/jpeg,image/gif,image/webp" multiple>
          <span id="image-status" class="attachment-status muted" role="status" aria-live="polite"></span>
        </div>
        <label class="target-input model-picker"><span>model</span><select id="model-ref" name="modelRef"><option value="">loading model…</option></select></label>
        <label class="target-input thinking-slider"><span>thinking</span><input id="thinking-level" type="range" min="0" max="5" step="1" value="5"><output id="thinking-level-value" for="thinking-level">xhigh</output></label>
      </div>

      <div class="target-row workspace-run-row">
        <button id="thread-submit" class="primary-btn run-btn" type="submit">start agent</button>
      </div>

      <div class="repo-tray" hidden>
        <select id="repo-picker" class="board-select" disabled>
          <option value="">GitHub repos</option>
        </select>
        <button id="repo-refresh" class="textbtn" type="button">refresh</button>
        <button id="choose-folder" class="textbtn" type="button" hidden>choose folder</button>
        <p id="repo-hint" class="muted">Sign in for repo picker.</p>
      </div>

      <div class="advanced-fields launch-details">
        <input name="name" placeholder="main agent name">
        <div id="provider-banner" class="notice" aria-live="polite">Connecting…</div>
      </div>

      <p id="thread-status" class="status-line"></p>
    </form>

    <section class="home-recent action-center" aria-label="Agents">
      <div class="section-row">
        <div>
          <h2>Agents</h2>
          <p id="action-summary" class="muted">Loading agent status…</p>
        </div>
        <div class="inline-actions">
          <a class="textbtn" href="/history.html">history</a>
          <button id="refresh-threads" class="textbtn" type="button">refresh</button>
        </div>
      </div>
      <div id="threads-list" class="action-lanes"></div>
    </section>
  </main>

  <script type="module" src="/app.js?v=agent-finish-toasts-1"></script>
</body>
</html>
