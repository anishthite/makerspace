<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Excalidraw viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://esm.sh/@excalidraw/excalidraw@0.18.1/dist/prod/index.css">
<style>
  :root { color-scheme: light; --viewer-bg: #ffffff; --viewer-fg: #1f1f1f; --preview-bg: #f7f8fb; }
  :root[data-theme="dark"] { color-scheme: dark; --viewer-bg: #111827; --viewer-fg: #e6edf3; --preview-bg: #101720; }
  html, body, #root { width: 100%; height: 100%; margin: 0; }
  body { overflow: hidden; background: var(--viewer-bg); color: var(--viewer-fg); font: 13px/1.4 Inter, system-ui, sans-serif; }
  .excalidraw { background: var(--viewer-bg) !important; }
  .state { display: grid; min-height: 100%; place-items: center; padding: 24px; text-align: center; }
  .state code { overflow-wrap: anywhere; }
  .preview-shell { position: relative; width: 100%; height: 100%; background: var(--preview-bg); }
  .preview { display: grid; width: 100%; height: 100%; place-items: center; overflow: hidden; }
  .preview[hidden] { display: none; }
  .preview svg { display: block; width: 100%; height: 100%; max-width: 100%; max-height: 100%; }
</style>
</head>
<body>
<div id="root"><div class="state">loading drawing…</div></div>
<script type="module">
  import React from 'https://esm.sh/react@18.3.1';
  import { createRoot } from 'https://esm.sh/react-dom@18.3.1/client';
  import { Excalidraw, exportToSvg } from 'https://esm.sh/@excalidraw/excalidraw@0.18.1?deps=react@18.3.1,react-dom@18.3.1';

  const e = React.createElement;
  const params = new URLSearchParams(location.search);
  const thread = params.get('thread') || params.get('name') || '';
  const rawArtifactPath = params.get('path') || '';
  const viewerTheme = ['dark', 'light'].includes(params.get('theme')) ? params.get('theme') : 'dark';
  const renderMode = params.get('mode') === 'preview' ? 'preview' : 'full';
  document.documentElement.dataset.theme = viewerTheme;

  function safeArtifactPath(value) {
    const text = String(value || '').trim().replace(/^(?:\.\/)+/, '').replaceAll('\\', '/');
    if (!text || text.startsWith('/') || /^[a-z][a-z0-9+.-]*:/i.test(text) || /[*?\[\]{}]/.test(text)) return '';
    const parts = text.split('/').filter(Boolean);
    if (!parts.length || parts.includes('..') || !parts.at(-1)?.endsWith('.excalidraw')) return '';
    return parts.join('/');
  }

  const artifactPath = safeArtifactPath(rawArtifactPath);

  const API_BASE = String(import.meta.env.VITE_SPANNER_API_BASE || '').trim().replace(/\/+$/, '');

  function apiUrl(path) {
    return `${API_BASE}${path}`;
  }

  function browserSession() {
    const nextKey = 'spannerBrowserSession';
    const legacyKey = 'workbenchBrowserSession';
    try {
      let session = localStorage.getItem(nextKey) || '';
      if (!session) {
        session = localStorage.getItem(legacyKey) || '';
        if (session) localStorage.setItem(nextKey, session);
      }
      localStorage.removeItem(legacyKey);
      return session;
    } catch {
      return '';
    }
  }

  function authHeaders() {
    const headers = {};
    const session = browserSession();
    if (session) headers['x-spanner-session'] = session;
    return headers;
  }

  function encodedPublicUrl(pathname) {
    const encoded = pathname.split('/').map((part, index) => index ? encodeURIComponent(part) : part).join('/');
    return new URL(encoded, location.origin).toString();
  }

  function publicArtifactUrls() {
    const leaf = artifactPath.split('/').at(-1) || artifactPath;
    return [...new Set([
      `/artifacts/${artifactPath}`,
      `/artifacts/${leaf}`,
      `/${artifactPath}`,
    ])].map(encodedPublicUrl);
  }

  async function fetchJson(url, options = {}) {
    const response = await fetch(url, { credentials: 'include', ...options });
    const text = await response.text();
    let payload;
    try {
      payload = text ? JSON.parse(text) : null;
    } catch {
      throw new Error(response.ok ? `Expected JSON from ${url}` : text.trim() || `Request failed: ${response.status}`);
    }
    if (!response.ok) throw new Error(payload?.error || `Request failed: ${response.status}`);
    return payload;
  }

  async function loadScene() {
    if (thread) {
      const url = apiUrl(`/api/threads/${encodeURIComponent(thread)}/artifacts?path=${encodeURIComponent(artifactPath)}`);
      const payload = await fetchJson(url, { headers: authHeaders() });
      return payload.data || payload;
    }

    const errors = [];
    for (const url of publicArtifactUrls()) {
      try {
        return await fetchJson(url);
      } catch (error) {
        errors.push(error.message);
      }
    }

    throw new Error(errors.find((message) => !/^Not found$/i.test(message)) || errors[0] || 'Not found');
  }

  function sceneBackgroundColor(scene) {
    const color = String(scene.appState?.viewBackgroundColor || '').trim().toLowerCase();
    if (viewerTheme === 'dark' && (!color || color === '#fff' || color === '#ffffff' || color === 'white')) return '#111827';
    return scene.appState?.viewBackgroundColor || '#ffffff';
  }

  function assertScene(scene) {
    if (scene?.type !== 'excalidraw' || !Array.isArray(scene.elements)) throw new Error('Not an Excalidraw drawing.');
    return scene;
  }

  function previewElements(scene) {
    return (scene.elements || []).filter((element) => !element?.isDeleted);
  }

  function exportAppState(scene) {
    return {
      ...(scene.appState || {}),
      theme: viewerTheme,
      viewModeEnabled: true,
      viewBackgroundColor: sceneBackgroundColor(scene),
      exportBackground: true,
      exportEmbedScene: false,
      exportWithDarkMode: viewerTheme === 'dark',
    };
  }

  async function loadInitialData() {
    if (!artifactPath) throw new Error('Missing drawing path.');
    const scene = assertScene(await loadScene());
    return {
      elements: scene.elements || [],
      appState: exportAppState(scene),
      files: scene.files || {},
      scrollToContent: true,
    };
  }

  async function loadPreviewSvg() {
    if (!artifactPath) throw new Error('Missing drawing path.');
    const scene = assertScene(await loadScene());
    const elements = previewElements(scene);
    if (!elements.length) throw new Error('Drawing has no visible elements.');
    const svg = await exportToSvg({
      elements,
      appState: exportAppState(scene),
      files: scene.files || {},
      exportPadding: 48,
    });
    svg.setAttribute('role', 'img');
    svg.setAttribute('aria-label', `Preview of ${artifactPath}`);
    svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
    return svg;
  }

  function State({ message }) {
    return e('div', { className: 'state' }, e('div', null, message));
  }

  function PreviewApp() {
    const hostRef = React.useRef(null);
    const [ready, setReady] = React.useState(false);
    const [error, setError] = React.useState('');

    React.useEffect(() => {
      let cancelled = false;
      loadPreviewSvg()
        .then((svg) => {
          if (cancelled || !hostRef.current) return;
          hostRef.current.replaceChildren(svg);
          setReady(true);
        })
        .catch((err) => { if (!cancelled) setError(err.message); });
      return () => { cancelled = true; };
    }, []);

    if (error) return e(State, { message: `Could not load ${artifactPath}: ${error}` });
    return e('div', { className: 'preview-shell' },
      !ready && e(State, { message: `Rendering ${artifactPath || 'drawing'}…` }),
      e('div', { className: 'preview', ref: hostRef, hidden: !ready, 'aria-busy': ready ? 'false' : 'true' }),
    );
  }

  function App() {
    const [initialData, setInitialData] = React.useState(null);
    const [error, setError] = React.useState('');

    React.useEffect(() => {
      let cancelled = false;
      loadInitialData()
        .then((data) => { if (!cancelled) setInitialData(data); })
        .catch((err) => { if (!cancelled) setError(err.message); });
      return () => { cancelled = true; };
    }, []);

    if (error) return e(State, { message: `Could not load ${artifactPath}: ${error}` });
    if (!initialData) return e(State, { message: `Loading ${artifactPath || 'drawing'}…` });

    return e(Excalidraw, {
      initialData,
      theme: viewerTheme,
      viewModeEnabled: true,
      zenModeEnabled: true,
      gridModeEnabled: false,
      renderScrollbars: true,
      UIOptions: {
        canvasActions: {
          clearCanvas: false,
          export: false,
          loadScene: false,
          saveToActiveFile: false,
          toggleTheme: false,
        },
      },
    });
  }

  createRoot(document.getElementById('root')).render(e(renderMode === 'preview' ? PreviewApp : App));
</script>
</body>
</html>
