<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
  <title id="title">Workbench logo</title>
  <desc id="desc">A minimal retro pixel-art workbench sprite beside the Workbench wordmark.</desc>
  <style>
    .bench, .word { fill: #241A12; }
    @media (prefers-color-scheme: dark) { .bench, .word { fill: #FAF8F3; } }
  </style>
  <rect width="720" height="220" fill="none"/>
  <g transform="translate(58 54) scale(7)">
    <rect x="2" y="4" width="12" height="2" fill="#1F5E9C"/>
    <rect class="bench" x="3" y="8" width="10" height="2"/>
    <rect class="bench" x="4" y="10" width="2" height="4"/>
    <rect class="bench" x="10" y="10" width="2" height="4"/>
    <rect class="bench" x="3" y="14" width="4" height="1"/>
    <rect class="bench" x="9" y="14" width="4" height="1"/>
  </g>
  <text class="word" x="210" y="120" font-family="Hack, 'Courier New', ui-monospace, monospace" font-size="43" font-weight="900" letter-spacing="2">WORKBENCH</text>
</svg>
