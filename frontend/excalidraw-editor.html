<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Excalidraw editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://esm.sh/@excalidraw/excalidraw@0.18.1/dist/prod/index.css">
<style>
  :root { color-scheme: light; --bg: #ffffff; --fg: #1f2937; --muted: #64748b; --panel: rgba(255,255,255,.92); --rule: rgba(100,116,139,.26); --blue: #2563eb; }
  :root[data-theme="dark"] { color-scheme: dark; --bg: #111827; --fg: #e6edf3; --muted: #9ca3af; --panel: rgba(17,24,39,.90); --rule: rgba(148,163,184,.28); --blue: #60a5fa; }
  html, body, #root { width: 100%; height: 100%; margin: 0; }
  body { overflow: hidden; background: var(--bg); color: var(--fg); font: 13px/1.4 Inter, system-ui, sans-serif; }
  button, a { font: inherit; }
  .excalidraw { background: var(--bg) !important; }
  .state { display: grid; min-height: 100%; place-items: center; padding: 24px; text-align: center; }
  .state code { overflow-wrap: anywhere; }
  .shell { width: 100%; height: 100%; }
  .toolbar { position: fixed; z-index: 10; top: 12px; left: 50%; display: flex; align-items: center; gap: 10px; max-width: calc(100% - 24px); transform: translateX(-50%); border: 1px solid var(--rule); border-radius: 10px; background: var(--panel); color: var(--fg); padding: 8px 10px; box-shadow: 0 18px 60px rgba(0,0,0,.22); backdrop-filter: blur(14px); }
  .toolbar strong { max-width: min(48vw, 520px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .toolbar span { color: var(--muted); font-size: 12px; }
  .toolbar button, .toolbar a { border: 1px solid var(--rule); border-radius: 8px; background: transparent; color: var(--fg); padding: 7px 10px; text-decoration: none; cursor: pointer; }
  .toolbar button.primary { border-color: var(--blue); background: var(--blue); color: #fff; font-weight: 800; }
  .toolbar button[disabled] { opacity: .55; cursor: default; }
</style>
</head>
<body>
<div id="root"><div class="state">loading editor…</div></div>
<script type="module">
  import React from 'https://esm.sh/react@18.3.1';
  import { createRoot } from 'https://esm.sh/react-dom@18.3.1/client';
  import { Excalidraw } from 'https://esm.sh/@excalidraw/excalidraw@0.18.1?deps=react@18.3.1,react-dom@18.3.1';

  const e = React.createElement;
  const params = new URLSearchParams(location.search);
  const thread = params.get('thread') || params.get('name') || '';
  const rawArtifactPath = params.get('path') || '';
  const editorTheme = ['dark', 'light'].includes(params.get('theme')) ? params.get('theme') : 'dark';
  document.documentElement.dataset.theme = editorTheme;

  function safeArtifactPath(value) {
    const text = String(value || '').trim().replace(/^(?:\.\/)+/, '').replaceAll('\\', '/');
    if (!text || text.startsWith('/') || /^[a-z][a-z0-9+.-]*:/i.test(text) || /[*?\[\]{}]/.test(text)) return '';
    const parts = text.split('/').filter(Boolean);
    if (!parts.length || parts.includes('..') || !parts.at(-1)?.endsWith('.excalidraw')) return '';
    return parts.join('/');
  }

  const artifactPath = safeArtifactPath(rawArtifactPath);
  const API_BASE = String(import.meta.env.VITE_SPANNER_API_BASE || '').trim().replace(/\/+$/, '');

  function apiUrl(path) {
    return `${API_BASE}${path}`;
  }

  function browserSession() {
    const nextKey = 'spannerBrowserSession';
    const legacyKey = 'workbenchBrowserSession';
    try {
      let session = localStorage.getItem(nextKey) || '';
      if (!session) {
        session = localStorage.getItem(legacyKey) || '';
        if (session) localStorage.setItem(nextKey, session);
      }
      localStorage.removeItem(legacyKey);
      return session;
    } catch {
      return '';
    }
  }

  function authHeaders() {
    const headers = {};
    const session = browserSession();
    if (session) headers['x-spanner-session'] = session;
    return headers;
  }

  async function fetchJson(url, options = {}) {
    const response = await fetch(url, { credentials: 'include', ...options });
    const text = await response.text();
    let payload;
    try {
      payload = text ? JSON.parse(text) : null;
    } catch {
      throw new Error(response.ok ? `Expected JSON from ${url}` : text.trim() || `Request failed: ${response.status}`);
    }
    if (!response.ok) throw new Error(payload?.error || `Request failed: ${response.status}`);
    return payload;
  }

  async function loadScene() {
    if (!thread) throw new Error('Missing thread. Open this editor from a thread artifact card.');
    if (!artifactPath) throw new Error('Missing drawing path.');
    const url = apiUrl(`/api/threads/${encodeURIComponent(thread)}/artifacts?path=${encodeURIComponent(artifactPath)}`);
    const payload = await fetchJson(url, { headers: authHeaders() });
    const scene = payload.data || payload;
    if (scene?.type !== 'excalidraw' || !Array.isArray(scene.elements)) throw new Error('Not an Excalidraw drawing.');
    return scene;
  }

  function cleanAppState(appState = {}) {
    const { collaborators, selectedElementIds, editingElement, resizingElement, draggingElement, suggestedBindings, ...rest } = appState || {};
    return rest;
  }

  function scenePayload(scene) {
    return {
      type: 'excalidraw',
      version: scene.version || 2,
      source: scene.source || 'https://excalidraw.com',
      elements: scene.elements || [],
      appState: cleanAppState(scene.appState || {}),
      files: scene.files || {},
    };
  }

  async function saveScene(scene) {
    const url = apiUrl(`/api/threads/${encodeURIComponent(thread)}/artifacts?path=${encodeURIComponent(artifactPath)}`);
    return fetchJson(url, {
      method: 'POST',
      headers: { ...authHeaders(), 'content-type': 'application/json' },
      body: JSON.stringify(scenePayload(scene)),
    });
  }

  function State({ message }) {
    return e('div', { className: 'state' }, e('div', null, message));
  }

  function App() {
    const [initialData, setInitialData] = React.useState(null);
    const sceneRef = React.useRef(null);
    const dirtyRef = React.useRef(false);
    const [dirty, setDirty] = React.useState(false);
    const [saving, setSaving] = React.useState(false);
    const [status, setStatus] = React.useState('');
    const [error, setError] = React.useState('');

    React.useEffect(() => {
      let cancelled = false;
      loadScene()
        .then((loaded) => {
          if (cancelled) return;
          const initial = {
            elements: loaded.elements || [],
            appState: { ...(loaded.appState || {}), theme: editorTheme, viewBackgroundColor: loaded.appState?.viewBackgroundColor || (editorTheme === 'dark' ? '#111827' : '#ffffff') },
            files: loaded.files || {},
            scrollToContent: true,
          };
          sceneRef.current = { type: 'excalidraw', version: loaded.version || 2, source: loaded.source, elements: initial.elements, appState: initial.appState, files: initial.files };
          setInitialData(initial);
        })
        .catch((err) => { if (!cancelled) setError(err.message); });
      return () => { cancelled = true; };
    }, []);

    async function onSave() {
      if (!sceneRef.current || saving) return;
      setSaving(true);
      setStatus('saving…');
      try {
        const result = await saveScene(sceneRef.current);
        dirtyRef.current = false;
        setDirty(false);
        setStatus(`saved ${result.path}`);
      } catch (err) {
        setStatus(`save failed: ${err.message}`);
      } finally {
        setSaving(false);
      }
    }

    if (error) return e(State, { message: `Could not load ${artifactPath}: ${error}` });
    if (!initialData) return e(State, { message: `Loading ${artifactPath || 'drawing'}…` });

    return e('div', { className: 'shell' },
      e('div', { className: 'toolbar' },
        e('strong', { title: artifactPath }, artifactPath),
        e('span', null, status || (dirty ? 'unsaved changes' : 'ready')),
        e('button', { className: 'primary', type: 'button', disabled: saving || !dirty, onClick: onSave }, saving ? 'saving…' : 'save'),
        e('a', { href: `/thread.html?name=${encodeURIComponent(thread)}` }, 'thread'),
      ),
      e(Excalidraw, {
        initialData,
        theme: editorTheme,
        zenModeEnabled: false,
        gridModeEnabled: false,
        renderScrollbars: true,
        onChange: (elements, appState, files) => {
          sceneRef.current = { type: 'excalidraw', version: sceneRef.current?.version || 2, source: sceneRef.current?.source, elements, appState, files };
          if (!dirtyRef.current) {
            dirtyRef.current = true;
            setDirty(true);
            setStatus('');
          }
        },
      }),
    );
  }

  createRoot(document.getElementById('root')).render(e(App));
</script>
</body>
</html>
