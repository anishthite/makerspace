<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spanner Chimes</title>
  <link rel="icon" href="/favicon.svg">
  <script type="module" src="/src/runtime/chime-preview.js"></script>
  <style>
    @import "/src/styles/app.css";
    body {
      min-height: 100vh;
      padding: clamp(18px, 5vw, 48px);
      background: var(--bg);
      color: var(--ink);
    }
    .chime-shell {
      display: grid;
      gap: 18px;
      width: min(760px, 100%);
      margin: 0 auto;
    }
    .chime-head {
      display: grid;
      gap: 8px;
    }
    .chime-head .textbtn {
      justify-self: start;
    }
    .chime-head h1 {
      margin: 0;
      font: 800 clamp(28px, 8vw, 54px)/.95 var(--sans);
      letter-spacing: 0;
    }
    .chime-head p {
      max-width: 56ch;
      margin: 0;
      color: var(--ink-3);
      font: 500 14px/1.5 var(--sans);
    }
    .chime-option {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 14px;
      border: 1px solid var(--rule);
      border-radius: 6px;
      padding: 14px;
      background: var(--paper);
      box-shadow: var(--shadow);
    }
    .chime-option.selected {
      border-color: color-mix(in srgb, var(--green) 54%, var(--rule));
      background: color-mix(in srgb, var(--paper-2) 86%, var(--green) 14%);
    }
    .chime-option h2 {
      margin: 0 0 4px;
      font: 700 16px/1.2 var(--sans);
      letter-spacing: 0;
    }
    .chime-option p {
      margin: 0;
      color: var(--ink-3);
      font-size: 13px;
    }
    .chime-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }
    .chime-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      color: var(--ink-3);
      font: 700 12px/1.4 var(--sans);
    }
    #chime-status {
      min-height: 18px;
      margin: 0;
    }
    @media (max-width: 620px) {
      .chime-option {
        grid-template-columns: 1fr;
      }
      .chime-actions {
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body data-mode="office">
  <main class="chime-shell">
    <header class="chime-head">
      <a class="textbtn" href="/workspace.html">agents</a>
      <h1>Done chimes</h1>
      <p>Spark is installed as the completion sound for finished agents.</p>
    </header>
    <section class="chime-option selected" aria-label="Installed chime">
      <div>
        <h2>spark</h2>
        <p>quick bright confirmation</p>
      </div>
      <div class="chime-actions">
        <button id="play-spark" class="primary-btn" type="button">play spark</button>
      </div>
    </section>
    <footer class="chime-footer">
      <button id="play-failed" class="textbtn" type="button">play failed tone</button>
      <p id="chime-status" aria-live="polite"></p>
    </footer>
  </main>
</body>
</html>
