name = "spanner-sandbox-broker"
main = "src/index.js"
compatibility_date = "2026-07-10"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
routes = [
  { pattern = "sandbox.spanner.sh/*", zone_name = "spanner.sh" },
  { pattern = "*-bridge.spanner.sh/*", zone_name = "spanner.sh" },
]

# Set CLOUDFLARE_ACCOUNT_ID in your shell for deploy; keep account_id out of git.
# Set BROKER_TOKEN with: wrangler secret put BROKER_TOKEN
# Set CLOUDFLARE_R2_ACCOUNT_ID (or CLOUDFLARE_ACCOUNT_ID), R2_ACCESS_KEY_ID, and R2_SECRET_ACCESS_KEY with wrangler secret put for production backups.

[vars]
BACKUP_BUCKET_NAME = "spanner-sandbox-backups"

[[containers]]
class_name = "Sandbox"
image = "../image/Dockerfile"
image_build_context = ".."
instance_type = "standard-2"
max_instances = 100

[[durable_objects.bindings]]
name = "Sandbox"
class_name = "Sandbox"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Sandbox"]

[[r2_buckets]]
binding = "BACKUP_BUCKET"
bucket_name = "spanner-sandbox-backups"
