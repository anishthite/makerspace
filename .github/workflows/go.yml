name: Go

on:
  pull_request:
    branches: [spanner-go]
  push:
    branches: [spanner-go, parallel-tool-calls]

permissions:
  contents: read

jobs:
  check:
    name: Go checks (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Verify dependencies
        run: go mod verify
      - name: Vet
        run: go vet ./...
      - name: Tests with race detector
        run: go test -race -count=1 ./...
      - name: Repeat concurrency tests
        run: go test -race -count=20 ./internal/agent ./internal/tui
      - name: Build
        run: go build ./...
