<rect width="1900" height="1120" fill="#ffffff"/>
<text x="60" y="60.0" fill="#1e40af" font-size="32" font-family="ui-monospace, Menlo, monospace" font-weight="700" text-anchor="start">Project picker dropdown: pick new project flow</text><text x="62" y="95.0" fill="#64748b" font-size="17" font-family="ui-monospace, Menlo, monospace" font-weight="400" text-anchor="start">One new dropdown option reuses the existing / project picker; no duplicate project-creation UI.</text><rect x="70" y="150" width="260" height="110" rx="14" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
