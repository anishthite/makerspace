<svg xmlns="http://www.w3.org/2000/svg" width="520" height="720" viewBox="0 0 520 720" role="img" aria-labelledby="title desc">
  <title id="title">Conductor-style sidebar grouping preview</title>
  <desc id="desc">A dark Spanner sidebar grouped first by project and then by worktree, with multiple thread rows inside each worktree.</desc>
  <defs>
    <style>
      .bg{fill:#181818}.panel{fill:#1f1f1f}.muted{fill:#8e8e8e}.fg{fill:#e7e7e7}.line{stroke:#333;stroke-width:1}.soft{fill:#272727}.sel{fill:#2b3542}.blue{fill:#7dd3fc}.amber{fill:#fbbf24}.green{fill:#34d399}.red{fill:#f87171} text{font-family:Inter,ui-sans-serif,system-ui,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    </style>
  </defs>
  <rect class="bg" width="520" height="720" rx="0"/>
  <text x="28" y="42" class="fg" font-size="22" font-weight="700">Spanner</text>
  <rect x="24" y="64" width="360" height="34" rx="8" class="panel"/>
  <text x="48" y="86" class="muted" font-size="13">Search agents</text>
  <rect x="396" y="64" width="96" height="34" rx="8" class="soft"/>
  <text x="421" y="86" class="fg" font-size="13" font-weight="700">+ thread</text>

  <g transform="translate(24 126)">
    <text x="0" y="0" class="fg" font-size="13" font-weight="800">makerspace</text>
    <text x="458" y="0" class="muted" font-size="12" text-anchor="end">5</text>
    <text x="26" y="28" class="muted mono" font-size="11">makerspace-20260811203917-8cb2ac</text>
    <text x="458" y="28" class="muted" font-size="11" text-anchor="end">3</text>
    <line x1="14" y1="44" x2="14" y2="188" class="line"/>
    <g transform="translate(28 42)">
      <rect width="430" height="78" rx="8" class="sel"/>
      <circle cx="18" cy="20" r="5" class="amber"/>
      <text x="34" y="22" class="fg" font-size="14" font-weight="650">Conductor sidebar grouping</text>
      <text x="34" y="47" class="amber" font-size="12">working · editing runtime</text>
      <text x="364" y="22" class="muted" font-size="12">12m</text>
    </g>
    <g transform="translate(28 126)">
      <rect width="430" height="36" rx="7" class="soft"/>
      <circle cx="18" cy="18" r="4" class="green"/>
      <text x="34" y="23" class="fg" font-size="13">Local thread switch latency</text>
      <text x="392" y="23" class="muted" font-size="12">2h</text>
    </g>
    <g transform="translate(28 168)">
      <rect width="430" height="36" rx="7" fill="transparent"/>
      <circle cx="18" cy="18" r="4" class="green"/>
      <text x="34" y="23" class="muted" font-size="13">Spanner Terra default</text>
      <text x="392" y="23" class="muted" font-size="12">1d</text>
    </g>

    <text x="26" y="246" class="muted mono" font-size="11">main</text>
    <text x="458" y="246" class="muted" font-size="11" text-anchor="end">2</text>
    <line x1="14" y1="262" x2="14" y2="336" class="line"/>
    <g transform="translate(28 260)">
      <rect width="430" height="36" rx="7" fill="transparent"/>
      <circle cx="18" cy="18" r="4" class="green"/>
      <text x="34" y="23" class="muted" font-size="13">Project picker new option</text>
      <text x="392" y="23" class="muted" font-size="12">1d</text>
    </g>
    <g transform="translate(28 302)">
      <rect width="430" height="36" rx="7" fill="transparent"/>
      <circle cx="18" cy="18" r="4" class="red"/>
      <text x="34" y="23" class="muted" font-size="13">Old prompt spike</text>
      <text x="392" y="23" class="muted" font-size="12">3d</text>
    </g>
  </g>

  <g transform="translate(24 518)">
    <text x="0" y="0" class="fg" font-size="13" font-weight="800">spanner-downloads</text>
    <text x="458" y="0" class="muted" font-size="12" text-anchor="end">2</text>
    <text x="26" y="28" class="muted mono" font-size="11">release-site</text>
    <line x1="14" y1="44" x2="14" y2="118" class="line"/>
    <g transform="translate(28 42)">
      <rect width="430" height="36" rx="7" fill="transparent"/>
      <circle cx="18" cy="18" r="4" class="amber"/>
      <text x="34" y="23" class="fg" font-size="13">DMG release landing</text>
      <text x="392" y="23" class="muted" font-size="12">31m</text>
    </g>
    <g transform="translate(28 84)">
      <rect width="430" height="36" rx="7" fill="transparent"/>
      <circle cx="18" cy="18" r="4" class="green"/>
      <text x="34" y="23" class="muted" font-size="13">Release action Apple auth</text>
      <text x="392" y="23" class="muted" font-size="12">4d</text>
    </g>
  </g>
</svg>
